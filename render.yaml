services:
  - type: web
    name: amicor-health-isf
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://amicor-health-isf-py.onrender.com
      - key: AMICOR_SEED_PASSWORD
        value: Amicor123!
      - key: AMICOR_DEPLOYMENT_SYNC_KEY
        value: Amicor123!
      - key: AMICOR_PUBLIC_URL
        value: https://amicor-health-isf-py.onrender.com
      - key: APP_VERSION
        value: 2026.07.10-production-fleet.1
      - key: AMICOR_ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: HEALTH_ISF_WS_MAX_ORG_CONNECTIONS
        value: "500"
      - key: HEALTH_ISF_WS_MAX_USER_CONNECTIONS
        value: "5"
      - key: SUPERVISION_LOG_RETENTION_DAYS
        value: "5"
      - key: HEALTH_ISF_STRIPE_ENABLED
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SENTRY_DSN
        sync: false
