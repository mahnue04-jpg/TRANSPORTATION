# alembic.ini — Alembic migration configuration for Amicor
# Run migrations from the backend/ directory:
#   cd backend && alembic upgrade head

[alembic]
# Path to the migration scripts (relative to this file's directory)
script_location = migrations

# Template used for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Truncate long slugs
truncate_slug_length = 40

# Timezone in revision files
timezone = UTC

# SQLAlchemy connection string — read from DATABASE_URL env var at runtime
# (set in migrations/env.py — leave this blank here)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamingHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
