<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6c63ff" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <title>Amicor — Your AI Assistant</title>

  <!-- KaTeX — math rendering (synchronous load so katex.renderToString is always ready) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <!-- Amicor rendering pipeline — must load after katex.min.js -->
  <script src="/static/render.js"></script>
  <script src="/static/streaming.js"></script>
  <script src="/static/orchestrator.js"></script>
  <!-- Hardened tool runtime modules — load order is dependency order -->
  <script src="/static/runtime/errors.js"></script>
  <script src="/static/runtime/lifecycle.js"></script>
  <script src="/static/runtime/events.js"></script>
  <script src="/static/runtime/registry.js"></script>
  <script src="/static/runtime/validator.js"></script>
  <script src="/static/runtime/permissions.js"></script>
  <script src="/static/runtime/metrics.js"></script>
  <script src="/static/runtime/streaming.js"></script>
  <script src="/static/runtime/runtime.js"></script>
  <script src="/static/tools.js"></script>
  <!-- UX polish modules -->
  <script src="/static/ux/onboarding.js"></script>
  <script src="/static/ux/uploadUX.js"></script>
  <script src="/static/ux/errorRecovery.js"></script>
  <script src="/static/ux/skeletonLoader.js"></script>
  <script src="/static/ux/productExperience.js"></script>
  <!-- Session & auth modules (MVP stabilization) -->
  <script src="/static/ux/sessionManager.js"></script>
  <script src="/static/ux/authUI.js"></script>
  <script src="/static/ux/reconnectHandler.js"></script>
  <!-- Runtime diagnostics (debug & monitoring) -->
  <script src="/static/ux/runtimeDiagnostics.js"></script>
  <!-- Production monitoring -->
  <script src="/static/monitoring/productionMonitor.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/static/sw.js").catch(function () {});
      });
    }
  </script>

  <style>
    /* KaTeX block equations: centre and allow horizontal scroll on small screens */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    :root {
      --bg:           #0b0b10;
      --surface:      #13131c;
      --surface2:     #1c1c28;
      --surface3:     #252535;
      --border:       #2a2a3e;
      --border2:      #353550;
      --accent:       #6c63ff;
      --accent-light: #8b85ff;
      --accent-glow:  rgba(108, 99, 255, 0.3);
      --text:         #e9e9f4;
      --text-dim:     #9494b8;
      --text-muted:   #5c5c7e;
      --user-bg:      #1e1e30;
      --ai-bg:        #151520;
      --error:        #ff5f72;
      --success:      #43c98a;
      --warn:         #f5a623;
      --radius:       18px;
      --radius-sm:    10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Sidebar / Header ─────────────────────────────────── */
    header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-avatar {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .brand-text h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .pill-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface3); }
    .pill-btn svg   { flex-shrink: 0; }

    /* ── Capability chips ─────────────────────────────────── */
    #capability-bar {
      flex-shrink: 0;
      padding: 8px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    #capability-bar::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.68rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent-light); background: rgba(108,99,255,0.08); }

    /* ── Product toolbar ─────────────────────────────────── */
    #product-toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    #conv-search {
      flex: 1;
      min-width: 140px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.78rem;
      padding: 7px 10px;
      outline: none;
    }

    #conv-search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .toolbar-btn {
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.72rem;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      transition: all 0.18s;
    }

    .toolbar-btn:hover {
      color: var(--text);
      border-color: var(--border2);
      background: var(--surface3);
    }

    #conversation-search-results {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      max-height: 160px;
      overflow-y: auto;
      padding: 4px 10px 8px;
    }

    .conv-hit {
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 10px;
      margin: 6px 0;
      padding: 7px 9px;
    }

    .conv-hit.pinned {
      border-color: rgba(108,99,255,0.45);
      background: rgba(108,99,255,0.08);
    }

    .conv-hit-title {
      font-size: 0.7rem;
      color: var(--accent-light);
      margin-bottom: 2px;
      font-weight: 600;
    }

    .conv-hit-body {
      font-size: 0.73rem;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .conv-hit.empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.74rem;
    }

    #workflow-center {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 12px;
    }

    .wf-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .wf-input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.78rem;
      padding: 7px 9px;
      outline: none;
    }

    .wf-input:focus {
      border-color: var(--accent);
    }

    #workflow-templates,
    #workflow-runs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 128px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .workflow-item,
    .workflow-run {
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 9px;
      padding: 7px 8px;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .workflow-item { cursor: pointer; }
    .workflow-item:hover { border-color: var(--accent); color: var(--text); }

    .workflow-name {
      color: var(--text);
      font-weight: 600;
      font-size: 0.74rem;
      margin-bottom: 2px;
    }

    .workflow-tags {
      color: var(--text-muted);
      font-size: 0.68rem;
    }

    .workflow-empty {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      padding: 6px;
    }

    #trust-strip {
      flex-shrink: 0;
      padding: 5px 16px;
      font-size: 0.68rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
    }

    #trust-strip.healthy { color: var(--success); }
    #trust-strip.degraded { color: var(--warn); }
    #trust-strip.critical { color: var(--error); }

    /* ── Chat area ────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Empty / Welcome ──────────────────────────────────── */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      padding: 32px 24px;
      pointer-events: none;
    }

    .welcome-avatar {
      width: 64px; height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      box-shadow: 0 0 30px var(--accent-glow);
      margin-bottom: 4px;
    }

    #welcome h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }
    #welcome p {
      font-size: 0.82rem;
      color: var(--text-dim);
      max-width: 280px;
      line-height: 1.55;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 320px;
      pointer-events: all;
      margin-top: 6px;
    }

    .welcome-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.18s;
      text-align: left;
    }
    .welcome-card:hover { border-color: var(--accent); background: rgba(108,99,255,0.07); }
    .welcome-card .wc-icon { font-size: 1.1rem; margin-bottom: 4px; }
    .welcome-card .wc-label { font-size: 0.72rem; color: var(--text-dim); font-weight: 500; }

    /* ── Message bubbles ──────────────────────────────────── */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      gap: 4px;
    }
    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.ai   { align-self: flex-start; align-items: flex-start; }
    .msg-row.grouped .msg-label { display: none; }
    .msg-row.grouped { margin-top: -8px; }

    .msg-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0 4px;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
      border: 1px solid transparent;
    }

    .msg-row.user .bubble {
      background: var(--user-bg);
      border-color: var(--border);
      border-bottom-right-radius: 5px;
      color: var(--text);
    }

    .msg-row.ai .bubble {
      background: var(--ai-bg);
      border-color: var(--border);
      border-bottom-left-radius: 5px;
      color: var(--text);
    }

    .bubble.error {
      border-color: var(--error) !important;
      color: var(--error);
    }

    /* Tool badge */
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0 4px;
    }
    .tool-badge span { font-size: 0.75rem; }

    .bubble-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .capability-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(108,99,255,0.12);
      border: 1px solid rgba(108,99,255,0.18);
    }

    .source-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .source-link {
      color: var(--text-dim);
      text-decoration: none;
      border-bottom: 1px dashed rgba(148,148,184,0.35);
    }

    .source-link:hover {
      color: var(--text);
      border-bottom-color: rgba(233,233,244,0.65);
    }

    /* ── Typing indicator ─────────────────────────────────── */
    .typing-bubble {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 13px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.15); }
    }

    /* ── Status bar ───────────────────────────────────────── */
    #status-bar {
      flex-shrink: 0;
      height: 24px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    #status-text {
      font-size: 0.7rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    #status-text.listen  { color: var(--accent-light); }
    #status-text.speak   { color: var(--success);      }
    #status-text.load    { color: var(--warn);         }
    #status-text.err     { color: var(--error);        }

    /* ── Input area ───────────────────────────────────────── */
    #input-wrap {
      flex-shrink: 0;
      padding: 10px 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 6px 6px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #msg {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.5;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      padding: 7px 0;
      font-family: inherit;
    }
    #msg::placeholder { color: var(--text-muted); }
    #msg::-webkit-scrollbar { width: 3px; }
    #msg::-webkit-scrollbar-thumb { background: var(--border); }

    .action-btn {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--surface3);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s, color 0.18s, transform 0.1s, box-shadow 0.18s;
    }
    .action-btn:hover  { background: var(--border2); color: var(--text); }
    .action-btn:active { transform: scale(0.91); }

    #btn-mic {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    #btn-mic:hover { background: var(--accent-light); }

    #btn-mic.recording {
      background: var(--error);
      box-shadow: 0 0 0 0 rgba(255,95,114,0.5);
      animation: micPulse 1.2s infinite;
    }
    #btn-mic.speaking {
      background: var(--success);
      box-shadow: 0 2px 10px rgba(67,201,138,0.35);
    }

    #btn-send {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    #btn-send:hover    { background: var(--accent-light); }
    #btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    @keyframes micPulse {
      0%   { box-shadow: 0 0 0 0   rgba(255,95,114,0.55); }
      70%  { box-shadow: 0 0 0 12px rgba(255,95,114,0);   }
      100% { box-shadow: 0 0 0 0   rgba(255,95,114,0);    }
    }

    /* ── Responsive ───────────────────────────────────────── */
    @media (min-width: 640px) {
      body { max-width: 680px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
      .msg-row { max-width: 72%; }
    }

    @media (max-width: 380px) {
      .welcome-grid { grid-template-columns: 1fr 1fr; }
      .msg-row { max-width: 88%; }
    }

    /* ── Safe area (iPhone notch) ──────────────────────────── */
    #input-wrap {
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    }

    /* ── Upload preview strip ──────────────────────────────── */
    #upload-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 2px 8px;
      min-height: 0;
    }

    /* ── Image OCR preview card ─────────────────────────────── */
    .ocr-preview {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 0.72rem;
      color: var(--text-dim);
      max-width: 100%;
      margin-top: 4px;
    }
    .ocr-preview .ocr-label {
      font-weight: 600;
      color: var(--accent-light);
      margin-bottom: 3px;
    }
    .ocr-preview .ocr-desc {
      color: var(--text-dim);
      font-style: italic;
    }
    .ocr-preview .ocr-method {
      font-size: 0.64rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── Toast system ───────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 9999;
      pointer-events: none;
    }
    .toast {
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text);
      font-size: 0.78rem;
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      animation: toastIn 0.25s ease, toastOut 0.3s ease 2.5s forwards;
      pointer-events: all;
      white-space: nowrap;
    }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.warn    { border-color: var(--warn);    color: var(--warn);    }
    .toast.error   { border-color: var(--error);   color: var(--error);   }
    @keyframes toastIn  { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; pointer-events:none; } }

    /* ── Streaming cursor ───────────────────────────────────── */
    .streaming-cursor::after {
      content: "▋";
      color: var(--accent);
      animation: cursorBlink 0.8s step-end infinite;
    }
    @keyframes cursorBlink { 0%,100% { opacity:1; } 50% { opacity:0; } }

    /* ── Provider badge ─────────────────────────────────────── */
    .provider-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.62rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(108,99,255,0.08);
      border: 1px solid rgba(108,99,255,0.15);
      color: var(--text-muted);
    }
    .provider-badge.fallback { background: rgba(245,166,35,0.08); border-color: rgba(245,166,35,0.2); color: var(--warn); }

    /* ── Monitoring status dot ─────────────────────────────── */
    #monitor-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
      transition: background 0.4s;
      box-shadow: 0 0 5px currentColor;
    }
    #monitor-dot.warn  { background: var(--warn); }
    #monitor-dot.error { background: var(--error); }

    /* ── Mobile thumb-friendly input ───────────────────────── */
    @media (max-width: 480px) {
      .action-btn { width: 44px; height: 44px; }
      #msg { font-size: 1rem; padding: 9px 0; }
      .input-box { padding: 6px 6px 6px 12px; }
    }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────── -->
<header>
  <div class="brand">
    <div class="brand-avatar">🤖</div>
    <div class="brand-text">
      <h1>Amicor</h1>
      <p>Your AI Assistant</p>
    </div>
  </div>
  <div class="header-actions">
    <span id="monitor-dot" title="Service healthy"></span>
    <button class="pill-btn" id="btn-reset">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Clear Memory
    </button>
  </div>
</header>

<!-- ── Capability chips ──────────────────────────────────── -->
<div id="capability-bar">
  <div class="chip" data-prompt="Search the latest tech news">📰 News</div>
  <div class="chip" data-prompt="What's the weather in Miami?">🌤 Weather</div>
  <div class="chip" data-prompt="What time is it in Tokyo?">🕐 Time</div>
  <div class="chip" data-prompt="Help me write a professional email">✉️ Draft Email</div>
  <div class="chip" data-prompt="Explain machine learning in simple terms">🎓 Explain</div>
  <div class="chip" data-prompt="Give me 5 ideas for a small business">💡 Ideas</div>
  <div class="chip" data-prompt="Summarize the key points of the Paris Agreement">🔍 Research</div>
</div>

<div id="product-toolbar">
  <input id="conv-search" type="text" placeholder="Search this conversation" />
  <button class="toolbar-btn" id="btn-pin">Pin Chat</button>
  <button class="toolbar-btn" id="btn-workflows">Workflows</button>
  <button class="toolbar-btn" id="btn-trust-refresh">Trust</button>
</div>

<div id="conversation-search-results" hidden></div>

<div id="workflow-center" hidden>
  <div class="wf-grid">
    <input id="workflow-name" class="wf-input" type="text" placeholder="Workflow name" />
    <input id="workflow-prompt" class="wf-input" type="text" placeholder="Reusable prompt" />
    <button class="toolbar-btn" id="workflow-save">Save Workflow</button>
    <div id="workflow-templates"></div>
    <div id="workflow-runs"></div>
  </div>
</div>

<div id="trust-strip">Trust: waiting for diagnostics...</div>

<!-- ── Toast container ───────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── Chat ─────────────────────────────────────────────── -->
<div id="chat">
  <div id="welcome">
    <div class="welcome-avatar">🤖</div>
    <h2>Hi, I'm Amicor</h2>
    <p>Your personal AI assistant for work, research, news, and everyday tasks.</p>
    <div class="welcome-grid">
      <div class="welcome-card" data-prompt="Search the latest headlines">
        <div class="wc-icon">📰</div>
        <div class="wc-label">Latest News</div>
      </div>
      <div class="welcome-card" data-prompt="What's the weather in New York?">
        <div class="wc-icon">🌤</div>
        <div class="wc-label">Weather</div>
      </div>
      <div class="welcome-card" data-prompt="Help me draft a business proposal">
        <div class="wc-icon">✍️</div>
        <div class="wc-label">Write & Draft</div>
      </div>
      <div class="welcome-card" data-prompt="What are the top AI trends right now?">
        <div class="wc-icon">🔍</div>
        <div class="wc-label">Research</div>
      </div>
    </div>
  </div>
</div>

<!-- ── Status bar ────────────────────────────────────────── -->
<div id="status-bar">
  <span id="status-text">Ready</span>
</div>

<!-- ── Input ─────────────────────────────────────────────── -->
<div id="input-wrap">
  <!-- Upload preview strip (file chips rendered here) -->
  <div id="upload-preview"></div>
  <div class="input-box">
    <textarea id="msg" rows="1" placeholder="Ask Amicor anything…"></textarea>
    <!-- Upload button injected by AmiCorUpload.init() -->
    <button class="action-btn" id="btn-mic" title="Tap to speak">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0M12 19v3M9 22h6"/>
      </svg>
    </button>
    <button class="action-btn" id="btn-send" title="Send">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const API   = "";   // same-origin — served by FastAPI
  let UID     = null; // Dynamically set after session/auth

  const chatEl      = document.getElementById("chat");
  const welcomeEl   = document.getElementById("welcome");
  const msgEl       = document.getElementById("msg");
  const btnSend     = document.getElementById("btn-send");
  const btnMic      = document.getElementById("btn-mic");
  const btnReset    = document.getElementById("btn-reset");
  const statusEl    = document.getElementById("status-text");
  const monitorDot  = document.getElementById("monitor-dot");
  const inputWrap   = document.getElementById("input-wrap");
  const uploadStrip = document.getElementById("upload-preview");
  const toastCtr    = document.getElementById("toast-container");
  const convSearchEl = document.getElementById("conv-search");
  const convSearchResultsEl = document.getElementById("conversation-search-results");
  const btnPin = document.getElementById("btn-pin");
  const btnWorkflows = document.getElementById("btn-workflows");
  const btnTrustRefresh = document.getElementById("btn-trust-refresh");
  const workflowPanel = document.getElementById("workflow-center");
  const workflowNameEl = document.getElementById("workflow-name");
  const workflowPromptEl = document.getElementById("workflow-prompt");
  const workflowSaveEl = document.getElementById("workflow-save");
  const workflowTemplatesEl = document.getElementById("workflow-templates");
  const workflowRunsEl = document.getElementById("workflow-runs");
  const trustStripEl = document.getElementById("trust-strip");

  let isListening = false;
  let isSpeaking  = false;
  let recognition = null;
  let productUX   = null;

  // ── Toast system ─────────────────────────────────────────
  function showToast(text, type = "") {
    const el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.textContent = text;
    toastCtr.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 2900);
  }

  function escapeHtmlText(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function restoreHistory() {
    if (!UID) return;
    try {
      const res = await fetch(`${API}/api/history/${encodeURIComponent(UID)}?limit=40`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const messages = Array.isArray(data.messages) ? data.messages : [];
      if (!messages.length) return;
      messages.forEach((item) => {
        if (item.role === "user") addBubble("user", item.content, null, false, null, true);
        else if (item.role === "assistant") addBubble("ai", item.content, "openai", false, null, true);
      });
      scrollBottom();
    } catch (err) {
      console.warn("[AmiCor] History restore failed:", err.message);
    }
  }

  // ── Session & Auth Init ──────────────────────────────────

  /**
   * Initialize auth flow: restore session from storage, or show login/signup.
   */
  async function initializeAuth() {
    // Try to restore existing session
    if (window.AmiCorSession) {
      const restored = AmiCorSession.restore();
      if (restored && restored.identity) {
        UID = restored.identity.userId;
        await restoreHistory();
        setStatus(`Welcome ${restored.identity.name}!`, "load");
        setTimeout(() => setStatus("Ready"), 2000);
        return;
      }
    }

    // No session — show auth UI
    return new Promise((resolve) => {
      if (!window.AmiCorAuthUI) {
        // Fallback if authUI not loaded
        UID = "guest_" + Date.now();
        resolve();
        return;
      }

      const toggleToSignup = () => {
        showSignupFlow();
      };
      const toggleToLogin = () => {
        showLoginFlow();
      };

      const showSignupFlow = () => {
        AmiCorAuthUI.showSignup(
          (identity) => {
            // User submitted signup form
            if (window.AmiCorSession) {
              AmiCorSession.start(identity);
              UID = window.AmiCorSession.getUserId();
            } else {
              UID = identity.email.split("@")[0] + "_" + Date.now();
            }
            restoreHistory();
            msgEl.focus();
            resolve();
          },
          toggleToLogin
        );
      };

      const showLoginFlow = () => {
        AmiCorAuthUI.showLogin(
          (identity) => {
            // User submitted login form (MVP: no backend auth)
            if (window.AmiCorSession) {
              AmiCorSession.start(identity);
              UID = window.AmiCorSession.getUserId();
            } else {
              UID = identity.email.split("@")[0] + "_" + Date.now();
            }
            restoreHistory();
            msgEl.focus();
            resolve();
          },
          toggleToSignup
        );
      };

      // Show signup by default
      showSignupFlow();
    });
  }

  // ── Reconnect monitoring ─────────────────────────────────

  if (window.AmiCorReconnect) {
    AmiCorReconnect.startMonitoring((status) => {
      if (status.status === "offline") {
        setStatus("Offline — will reconnect", "err");
        msgEl.disabled = true;
        btnSend.disabled = true;
      } else if (status.status === "reconnecting") {
        setStatus(`Reconnecting… (${status.nextRetryMs}ms)`, "load");
      } else if (status.status === "online") {
        setStatus("Reconnected", "speak");
        msgEl.disabled = false;
        setTimeout(() => setStatus("Ready"), 2000);
      }
    });
  }

  // ── UX modules init ──────────────────────────────────────

  // Skeleton: hide immediately (page is already rendered)
  if (window.AmiCorSkeleton) AmiCorSkeleton.hidePageSkeleton({ animate: false });

  // Production monitor: start heartbeat
  if (window.AmiCorMonitor) {
    AmiCorMonitor.start({ heartbeatMs: 60000 });
    AmiCorMonitor.subscribe(report => {
      if (!monitorDot) return;
      if (!report.heartbeatOk) {
        monitorDot.className = "error";
        monitorDot.title     = "Service health check failed";
      } else if (report.errorRate > 0.2) {
        monitorDot.className = "warn";
        monitorDot.title     = `High error rate: ${(report.errorRate * 100).toFixed(0)}%`;
      } else {
        monitorDot.className = "";
        monitorDot.title     = "Service healthy";
      }
      if (productUX) productUX.updateTrustSnapshot();
    });
  }

  // Upload UX: init after DOM ready
  if (window.AmiCorUpload) {
    const uploadBtn = AmiCorUpload.init({
      stripContainer: uploadStrip,
      dropZoneEl:     document.querySelector(".input-box"),
      onAttach: (list) => {
        if (list.some(a => a.status === "uploading")) setStatus("Uploading file…", "load");
        else setStatus("Ready");
      },
      onUploadComplete: (attachments) => {
        // Render OCR preview card for image attachments
        attachments.forEach(att => {
          if (!att.ocrResult) return;
          const ocr = att.ocrResult;
          const prev = document.createElement("div");
          prev.className = "ocr-preview";
          const label = document.createElement("div");
          label.className = "ocr-label";
          label.textContent = `🔍 Image Analysis — ${att.file.name}`;
          prev.appendChild(label);
          if (ocr.description) {
            const desc = document.createElement("div");
            desc.className = "ocr-desc";
            desc.textContent = ocr.description.slice(0, 160) + (ocr.description.length > 160 ? "…" : "");
            prev.appendChild(desc);
          }
          if (ocr.text) {
            const txt = document.createElement("div");
            txt.style.cssText = "margin-top:4px; color:var(--text); font-size:0.70rem;";
            txt.textContent = ocr.text.slice(0, 120) + (ocr.text.length > 120 ? "…" : "");
            prev.appendChild(txt);
          }
          const method = document.createElement("div");
          method.className = "ocr-method";
          method.textContent = `Method: ${ocr.method} · Confidence: ${Math.round((ocr.confidence || 0)*100)}% · ${ocr.word_count} words`;
          prev.appendChild(method);
          uploadStrip.appendChild(prev);
        });
        showToast("File attached and analyzed", "success");
      },
    });
    // Insert upload button before the mic button inside .input-box
    if (uploadBtn && btnMic && btnMic.parentNode) {
      btnMic.parentNode.insertBefore(uploadBtn, btnMic);
    }
  }

  // Onboarding: show on first visit (only if user is authenticated)
  if (window.AmiCorOnboarding) {
    AmiCorOnboarding.init({ onComplete: () => { msgEl.focus(); } });
  }

  function initProductExperience() {
    if (!window.AmiCorProductExperience || !UID) return;

    productUX = AmiCorProductExperience.createController({
      namespace: UID,
      refs: {
        searchInput: convSearchEl,
        searchResults: convSearchResultsEl,
        pinBtn: btnPin,
        workflowToggleBtn: btnWorkflows,
        workflowPanel: workflowPanel,
        workflowName: workflowNameEl,
        workflowPrompt: workflowPromptEl,
        workflowSaveBtn: workflowSaveEl,
        workflowTemplates: workflowTemplatesEl,
        workflowRuns: workflowRunsEl,
        trustStrip: trustStripEl,
        refreshTrustBtn: btnTrustRefresh,
      },
      onSetupComplete: function () {
        showToast("Setup profile saved", "success");
      },
    });

    if (productUX.listWorkflowTemplates().length === 0) {
      productUX.saveWorkflowTemplate({
        name: "Client Follow-up",
        prompt: "Draft a concise client follow-up with action items",
        actions: [{ type: "chat" }, { type: "email_draft" }],
      });
      productUX.saveWorkflowTemplate({
        name: "Daily Brief",
        prompt: "Summarize top updates and produce a priority checklist",
        actions: [{ type: "search" }, { type: "chat" }],
      });
      productUX.refreshWorkflowPanel();
    }

    if (!productUX.isSetupCompleted()) {
      productUX.completeSetup({
        mode: "guided-default",
        createdAt: new Date().toISOString(),
      });
      showToast("First-run setup completed", "success");
    }
  }

  // ── Helpers ──────────────────────────────────────────────

  function setStatus(msg, cls = "") {
    statusEl.textContent = msg;
    statusEl.className   = cls;
  }

  function hideWelcome() {
    if (welcomeEl && welcomeEl.parentNode === chatEl) {
      chatEl.removeChild(welcomeEl);
    }
  }

  function scrollBottom(force) {
    const threshold = 150;
    const nearBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < threshold;
    if (force || nearBottom) chatEl.scrollTop = chatEl.scrollHeight;
  }

  // ── Keyboard shortcuts ───────────────────────────────────
  document.addEventListener("keydown", e => {
    // Ctrl+K — focus input
    if ((e.ctrlKey || e.metaKey) && e.key === "k") {
      e.preventDefault();
      msgEl.focus();
      msgEl.select();
    }
    // Escape — blur input
    if (e.key === "Escape" && document.activeElement === msgEl) {
      msgEl.blur();
    }
  });

  function autoResize() {
    msgEl.style.height = "auto";
    msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + "px";
  }

  // ── Bubble factory ───────────────────────────────────────

  const TOOL_ICONS = { weather:"🌤", time:"🕐", news:"📰", search:"🔍", openai:"🤖", business:"💼", education:"🎓", email:"✉️" };

  // ── Content renderer ─────────────────────────────────────────
  // Delegated entirely to render.js (window.AmiCorRenderer).
  // See backend/static/render.js for the full pipeline documentation.

  function addBubble(role, text, tool, isError = false, meta = null, skipScroll = false) {
    hideWelcome();
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    const lastRow = chatEl.lastElementChild;
    if (lastRow && lastRow.classList && lastRow.classList.contains("msg-row") && lastRow.classList.contains(role)) {
      row.classList.add("grouped");
    }

    const label = document.createElement("div");
    label.className = "msg-label";

    if (role === "ai" && tool && tool !== "openai") {
      label.innerHTML = `<span class="tool-badge"><span>${TOOL_ICONS[tool] || "⚙️"}</span>${tool}</span>`;
    } else {
      label.textContent = role === "user" ? "You" : "Amicor";
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " error" : "");

    if (role === "ai") {
      bubble.innerHTML = AmiCorRenderer.renderContent(text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(label);
    row.appendChild(bubble);

    if (role === "ai" && meta && (meta.status || (meta.sources && meta.sources.length))) {
      const metaEl = document.createElement("div");
      metaEl.className = "bubble-meta";

      if (meta.status) {
        const state = document.createElement("span");
        state.className = "capability-state";
        state.textContent = meta.status === "partial" ? "Live result with fallback" : meta.status === "error" ? "Capability error" : "Live capability";
        metaEl.appendChild(state);
      }

      if (meta.sources && meta.sources.length) {
        const sources = document.createElement("div");
        sources.className = "source-list";
        meta.sources.forEach((source) => {
          const link = document.createElement("a");
          link.className = "source-link";
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noreferrer noopener";
          link.textContent = source.label || source.title || source.url;
          sources.appendChild(link);
        });
        metaEl.appendChild(sources);
      }

      row.appendChild(metaEl);
    }

    chatEl.appendChild(row);
    if (productUX) {
      productUX.trackMessage(role, text, {
        tool: tool || null,
        isError: !!isError,
        hasSources: !!(meta && meta.sources && meta.sources.length),
      });
    }
    if (!skipScroll) scrollBottom();
    return bubble;
  }

  function showTyping() {
    hideWelcome();
    const row = document.createElement("div");
    row.className = "msg-row ai";
    row.id = "typing";

    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = "Amicor";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;

    row.appendChild(label);
    row.appendChild(bubble);
    chatEl.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    const el = document.getElementById("typing");
    if (el) el.remove();
  }

  // ── API send (streaming) ─────────────────────────────────

  async function sendMessage(text) {
    if (!UID) {
      setStatus("Session lost. Please refresh.", "err");
      return;
    }

    text = text.trim();
    if (!text) return;

    // Gather any uploaded file context
    let fullText = text;
    if (window.AmiCorUpload) {
      const ctx = AmiCorUpload.getExtractedContext();
      if (ctx) fullText = text + "\n\n" + ctx;
    }

    addBubble("user", text);
    msgEl.value = "";
    autoResize();
    btnSend.disabled = true;
    if (window.AmiCorSkeleton) AmiCorSkeleton.showInputLock(inputWrap);
    showTyping();
    setStatus("Thinking…", "load");
    if (window.AmiCorMonitor) AmiCorMonitor.trackActivity();

    const t0 = Date.now();
    try {
      const res = await fetch(`${API}/api/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: UID, message: fullText })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      removeTyping();
      hideWelcome();

      // Create streaming bubble
      const row    = document.createElement("div");
      row.className = "msg-row ai";
      const label  = document.createElement("div");
      label.className = "msg-label";
      label.textContent = "Amicor";
      const bubble = document.createElement("div");
      bubble.className = "bubble streaming-cursor";
      row.appendChild(label);
      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollBottom();

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let fullContent = "";
      let toolResult = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6).trim();
          if (raw === "[DONE]") break;
          try {
            const evt = JSON.parse(raw);
            if (evt.type === "token") {
              fullContent += evt.content;
              bubble.innerHTML = AmiCorRenderer.renderContent(fullContent);
              bubble.classList.add("streaming-cursor");
              scrollBottom();
            } else if (evt.type === "complete") {
              // Tool call result — render as full bubble
              toolResult = evt;
              fullContent = evt.reply || "";
              const tool = evt.tool || "openai";
              label.innerHTML = `<span class="tool-badge"><span>${TOOL_ICONS[tool] || "⚙️"}</span>${tool}</span>`;
              bubble.innerHTML = AmiCorRenderer.renderContent(fullContent);
            } else if (evt.type === "error") {
              bubble.className = "bubble error";
              bubble.textContent = evt.content;
            }
          } catch (_) {}
        }
      }

      // Remove streaming cursor
      bubble.classList.remove("streaming-cursor");

      const durationMs = Date.now() - t0;
      if (window.AmiCorMonitor) AmiCorMonitor.record(durationMs, false);

      // Render metadata for tool results
      if (toolResult) {
        const sources = Array.isArray(toolResult.sources) ? toolResult.sources : [];
        const status  = toolResult.status || "success";
        if (sources.length || status === "partial") {
          const metaEl = document.createElement("div");
          metaEl.className = "bubble-meta";
          if (status === "partial") {
            const state = document.createElement("span");
            state.className = "capability-state";
            state.textContent = "Live result with fallback";
            metaEl.appendChild(state);
          }
          if (sources.length) {
            const srcList = document.createElement("div");
            srcList.className = "source-list";
            sources.forEach(source => {
              const a = document.createElement("a");
              a.className = "source-link";
              a.href = source.url; a.target = "_blank"; a.rel = "noreferrer noopener";
              a.textContent = source.label || source.title || source.url;
              srcList.appendChild(a);
            });
            metaEl.appendChild(srcList);
          }
          if (toolResult.meta && toolResult.meta.provider) {
            const pb = document.createElement("span");
            pb.className = "provider-badge" + (status === "partial" ? " fallback" : "");
            pb.textContent = toolResult.meta.provider;
            metaEl.appendChild(pb);
          }
          row.appendChild(metaEl);
        }
      }

      const isErr = fullContent.startsWith("Error:") || fullContent.startsWith("Connection error");
      if (productUX) {
        productUX.trackMessage("ai", fullContent, {
          tool: toolResult && toolResult.tool ? toolResult.tool : "openai",
          status: toolResult && toolResult.status ? toolResult.status : "success",
        });
      }
      if (isErr && window.AmiCorErrorRecovery) {
        AmiCorErrorRecovery.addRetryButton(row, async () => { row.remove(); await sendMessage(text); });
      }

      if (!isErr) speakText(fullContent);
      if (window.AmiCorUpload) AmiCorUpload.clear();
      setStatus("Ready");
    } catch (err) {
      const durationMs = Date.now() - t0;
      if (window.AmiCorMonitor) AmiCorMonitor.record(durationMs, true);
      if (window.AmiCorErrorRecovery) AmiCorErrorRecovery.trackError("sendMessage", err);
      removeTyping();
      const bubble = addBubble("ai", `Connection error: ${err.message}`, null, true);
      if (window.AmiCorErrorRecovery) {
        AmiCorErrorRecovery.addRetryButton(bubble.parentElement, async () => {
          bubble.parentElement.remove();
          await sendMessage(text);
        });
      }
      setStatus("Request failed", "err");
      showToast("Request failed — tap retry", "error");
    } finally {
      btnSend.disabled = false;
      if (window.AmiCorSkeleton) AmiCorSkeleton.hideInputLock();
    }
  }

  // ── Speech synthesis ─────────────────────────────────────

  function speakText(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

    // Truncate very long responses for speech
    const spoken = text.length > 400 ? text.slice(0, 400) + "…" : text;
    const utter  = new SpeechSynthesisUtterance(spoken);
    utter.rate   = 1.05;
    utter.pitch  = 1;

    utter.onstart = () => {
      isSpeaking = true;
      btnMic.classList.add("speaking");
      setStatus("Speaking…", "speak");
    };
    const done = () => {
      isSpeaking = false;
      btnMic.classList.remove("speaking");
      setStatus("Ready");
    };
    utter.onend   = done;
    utter.onerror = done;

    // Chrome bug: speech stops after ~15s on long text without this
    window.speechSynthesis.speak(utter);
  }

  // ── Speech recognition ────────────────────────────────────

  function buildRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.continuous     = false;
    r.interimResults = true;
    r.lang           = "en-US";

    r.onstart  = () => { isListening = true; btnMic.classList.add("recording"); setStatus("Listening…", "listen"); };
    r.onresult = (e) => {
      msgEl.value = Array.from(e.results).map(x => x[0].transcript).join("");
      autoResize();
    };
    r.onerror  = (e) => {
      stopRecognition();
      // User denying mic permission is non-fatal; keep health/status in warning state.
      if (e.error === "not-allowed") setStatus("Microphone access denied", "load");
      else if (e.error !== "no-speech") setStatus(`Mic error: ${e.error}`, "err");
    };
    r.onend    = () => {
      stopRecognition();
      if (msgEl.value.trim()) sendMessage(msgEl.value);
    };
    return r;
  }

  function startRecognition() {
    if (isSpeaking) { window.speechSynthesis.cancel(); }
    if (!recognition) recognition = buildRecognition();
    if (!recognition) { setStatus("Speech recognition not supported. Use Chrome.", "err"); return; }
    try { recognition.start(); } catch (_) {}
  }

  function stopRecognition() {
    isListening = false;
    btnMic.classList.remove("recording");
    if (recognition) try { recognition.stop(); } catch (_) {}
  }

  // ── Events ───────────────────────────────────────────────

  btnMic.addEventListener("click", () => {
    isListening ? stopRecognition() : startRecognition();
  });

  btnSend.addEventListener("click", () => sendMessage(msgEl.value));

  msgEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(msgEl.value); }
  });

  msgEl.addEventListener("input", autoResize);

  btnReset.addEventListener("click", async () => {
    if (!UID) return;
    try {
      const res  = await fetch(`${API}/api/reset`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: UID })
      });
      const data = await res.json();
      if (data.status === "memory cleared") {
        chatEl.innerHTML = "";
        chatEl.appendChild(welcomeEl);
        setStatus("Memory cleared", "speak");
        setTimeout(() => setStatus("Ready"), 2500);
      } else {
        setStatus("Failed to clear memory", "err");
      }
    } catch (err) {
      setStatus(`Reset error: ${err.message}`, "err");
    }
  });

  // Capability chips + welcome cards
  document.querySelectorAll(".chip, .welcome-card").forEach(el => {
    el.addEventListener("click", () => {
      const prompt = el.dataset.prompt;
      if (prompt) { msgEl.value = prompt; autoResize(); msgEl.focus(); }
    });
  });

  // Mic unsupported visual hint
  if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
    btnMic.style.opacity = "0.35";
    btnMic.style.cursor  = "not-allowed";
    btnMic.title = "Speech recognition requires Chrome or Edge";
  }

  // ── Bootstrap: Init auth on page load ────────────────────

  (async () => {
    await initializeAuth();
    initProductExperience();
    // After auth succeeds, app is ready for use
    msgEl.focus();
  })();
</script>
</body>
</html>
