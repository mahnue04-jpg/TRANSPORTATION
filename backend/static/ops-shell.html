<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b6bcb" />
  <title>AMICOR Operations</title>
  <link rel="icon" href="/static/branding/favicon.ico?v=20260803.1" sizes="any" />
  <link rel="icon" href="/static/branding/amicor-mark.png?v=20260803.1" type="image/png" />
  <link rel="apple-touch-icon" href="/static/branding/apple-touch-icon.png?v=20260803.1" />
  <link rel="manifest" href="/static/manifest.webmanifest?v=20260803.1" />
  <link rel="stylesheet" href="/static/branding/brand.css?v=20260803.1" />
  <link rel="stylesheet" href="/static/ops-shell.css?v=20260827.9" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div id="ops-app" class="ops-app">
    <aside class="ops-sidebar">
      <div class="ops-brand amicor-brand-lockup">
        <img class="amicor-logo-full amicor-logo-full-sm" src="/static/branding/amicor-logo-full.png?v=20260803.1" alt="AMICOR — Transport. Care. Connect." decoding="async" />
      </div>
      <nav class="ops-nav" aria-label="Primary navigation">
        <a href="/app" data-route="home">Home</a>
        <a href="/app/dashboard" data-route="dashboard">Dashboard</a>
        <a href="/app/dispatch" data-route="dispatch">Dispatch</a>
        <a href="/app/trips" data-route="trips">Trips</a>
        <a href="/app/drivers" data-route="drivers">Drivers</a>
        <a href="/app/riders" data-route="riders">Riders / Patients</a>
        <a href="/app/providers" data-route="providers">Providers</a>
        <a href="/app/vehicles" data-route="vehicles">Vehicles</a>
        <a href="/app/billing" data-route="billing">Billing</a>
        <a href="/app/analytics" data-route="analytics">Analytics</a>
        <a href="/app/alerts" data-route="alerts">Alerts</a>
        <a href="/app/mobile" data-route="mobile">Driver Mobile</a>
        <a href="/app/ai-assistant" data-route="ai-assistant">Amicor Nova</a>
        <a href="/app/settings" data-route="settings">Settings</a>
      </nav>
      <section class="ops-role-box" aria-label="Role selector">
        <label for="role-select">Role view</label>
        <select id="role-select">
          <option value="admin">admin</option>
          <option value="dispatcher">dispatcher</option>
          <option value="rider">rider</option>
          <option value="driver">driver</option>
          <option value="provider">provider</option>
           <option value="compliance_officer">compliance_officer</option>
           <option value="supervisor">supervisor</option>
           <option value="driver_support">driver_support</option>
           <option value="medical_coordinator">medical_coordinator</option>
        </select>
        <p id="role-context" class="ops-role-context">Role context loading...</p>
      </section>
    </aside>

    <main class="ops-main">
      <header class="ops-topbar">
        <div>
          <p class="ops-kicker">AMICOR</p>
          <h2 id="page-title">Dashboard</h2>
          <p id="page-subtitle" class="ops-subtitle">Operational platform surface</p>
        </div>
        <div class="ops-topbar-meta">
          <label class="ops-search" for="ops-search-input">
            <span class="sr-only">Search operational entities</span>
            <input id="ops-search-input" type="search" placeholder="Search trips, drivers, patients..." autocomplete="off" />
          </label>
          <span id="workspace-pill" class="badge badge-soft">workspace: operations</span>
          <span id="last-updated-pill" class="badge badge-soft">updated —</span>
          <span id="connection-badge" class="badge badge-neutral">checking backend</span>
          <span id="notification-pill" class="badge badge-warn">alerts: 0</span>
          <span id="role-badge" class="badge badge-soft">role: admin</span>
          <div class="ops-user-pill" aria-label="Current operator">
            <strong id="ops-user-name">Operator</strong>
            <small id="ops-user-role">session</small>
          </div>
        </div>
      </header>

      <section id="page-content" class="ops-content" aria-live="polite"></section>
    </main>
  </div>

  <script src="/static/roles/role-navigation.js?v=20260826.1"></script>
  <script src="/static/roles/role-workspaces.js?v=20260723.1"></script>
  <script src="/static/modules/operational-events.js?v=20260525.8"></script>
  <script src="/static/modules/trip-lifecycle.js?v=20260525.8"></script>
  <script src="/static/modules/dispatch-runtime.js?v=20260525.8"></script>
  <script src="/static/modules/driver-runtime.js?v=20260525.8"></script>
  <script src="/static/modules/rider-runtime.js?v=20260525.8"></script>
  <script src="/static/modules/telemetry-engine.js?v=20260525.8"></script>
  <script src="/static/modules/notifications-engine.js?v=20260525.8"></script>
  <script src="/static/modules/mobile-runtime.js?v=20260525.8"></script>
  <script src="/static/ux/sessionManager.js?v=20260604.1"></script>
  <script src="/static/ux/authUI.js?v=20260803.1"></script>
  <script src="/static/ux/voiceRuntime.js?v=20260512.1"></script>
  <script src="/static/ux/humanVoiceEngine.js?v=20260826.4"></script>
  <script src="/static/ux/uploadUX.js?v=20260827.1"></script>
  <script src="/static/branding/brand.js?v=20260803.1"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/ops-shell.js?v=20260827.9"></script>
</body>
</html>
