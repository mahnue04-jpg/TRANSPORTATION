<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AMICOR Nova — Forgot Password</title>
  <link rel="icon" href="/static/branding/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/static/branding/brand.css" />
  <link rel="stylesheet" href="/static/nova-signup/signup.css" />
</head>
<body>
  <header class="signup-header amicor-brand-lockup">
    <img class="amicor-logo-full" src="/static/branding/amicor-logo-full.png" alt="AMICOR" />
    <div>
      <p class="brand-kicker">AMICOR NOVA</p>
      <h1>Forgot password</h1>
    </div>
  </header>
  <main class="signup-main">
    <div id="banner" class="banner hidden" role="status"></div>
    <form id="forgot-form" class="signup-form">
      <p class="hint">Enter the email for your Nova account. If an account exists, we will send reset instructions.</p>
      <label>Email<input id="email" name="email" type="email" required autocomplete="email" /></label>
      <button type="submit">Send reset link</button>
      <p class="hint"><a href="/nova">Back to sign in</a></p>
    </form>
  </main>
  <script src="/static/nova-auth/forgot.js"></script>
</body>
</html>
