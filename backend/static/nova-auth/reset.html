<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AMICOR Nova — Set New Password</title>
  <link rel="icon" href="/static/branding/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/static/branding/brand.css" />
  <link rel="stylesheet" href="/static/nova-signup/signup.css" />
</head>
<body>
  <header class="signup-header amicor-brand-lockup">
    <img class="amicor-logo-full" src="/static/branding/amicor-logo-full.png" alt="AMICOR" />
    <div>
      <p class="brand-kicker">AMICOR NOVA</p>
      <h1>Set new password</h1>
    </div>
  </header>
  <main class="signup-main">
    <div id="banner" class="banner hidden" role="status"></div>
    <form id="reset-form" class="signup-form">
      <p class="hint">Choose a new password for your AMICOR Nova account.</p>
      <label>New password<input id="new_password" name="new_password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" /></label>
      <label>Confirm password<input id="confirm_password" name="confirm_password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" /></label>
      <button type="submit">Update password</button>
      <p class="hint"><a href="/nova">Return to sign in</a></p>
    </form>
  </main>
  <script src="/static/nova-auth/reset.js"></script>
</body>
</html>
