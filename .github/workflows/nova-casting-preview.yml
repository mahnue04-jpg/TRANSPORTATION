name: Nova Casting Preview Checks

on:
  pull_request:
    paths:
      - "backend/static/nova-creative/index.html"
      - "backend/static/nova-creative/casting-preview.html"
      - "backend/static/nova-creative/casting-sandbox.html"
      - "backend/tests/test_nova_casting_preview.py"
      - "backend/tests/test_nova_casting_draft_schema.py"
      - "backend/tests/test_nova_casting_migration_draft.py"
      - "backend/tests/test_nova_casting_migration_execution.py"
      - "backend/tests/test_nova_casting_content_migration.py"
      - "backend/tests/test_nova_casting_two_migrations.py"
      - "backend/migrations/versions/20261010_casting_content_draft.py"
      - "backend/migrations/versions/20261010_casting_org_draft.py"
      - "backend/tests/test_nova_casting_policy.py"
      - "backend/tests/test_nova_casting_upload_rules.py"
      - "backend/tests/test_nova_casting_workflow_policy.py"
      - "backend/tests/test_nova_casting_responses.py"
      - "backend/tests/test_nova_casting_identity.py"
      - "backend/tests/test_nova_casting_membership.py"
      - "backend/tests/test_nova_casting_read_service.py"
      - "backend/tests/test_nova_casting_router_draft.py"
      - "backend/tests/test_nova_casting_db_reads.py"
      - "backend/app/core/nova/creative_studio/casting_db_reads.py"
      - "backend/app/core/nova/creative_studio/casting_router_draft.py"
      - "backend/app/core/nova/creative_studio/casting_read_service.py"
      - "backend/app/core/nova/creative_studio/casting_membership.py"
      - "backend/tests/test_nova_casting_access.py"
      - "backend/tests/test_nova_casting_media_access.py"
      - "backend/tests/test_nova_casting_audit.py"
      - "backend/tests/test_nova_casting_audit_consent.py"
      - "backend/tests/test_nova_casting_flags.py"
      - "backend/tests/test_nova_casting_intake_schema.py"
      - "backend/tests/test_nova_casting_schema_guard.py"
      - "backend/tests/test_nova_casting_schema_repair.py"
      - "backend/tests/test_nova_casting_router_sandbox.py"
      - "backend/tests/test_nova_casting_sandbox_page.py"
      - "backend/tests/test_nova_casting_router_http.py"
      - "backend/tests/test_nova_casting_sandbox_http.py"
      - "backend/app/core/nova/creative_studio/casting_flags.py"
      - "backend/app/core/nova/creative_studio/casting_intake_schema.py"
      - "backend/migrations/versions/20261010_casting_audit_consent_draft.py"
      - "backend/migrations/versions/20261011_casting_schema_repair.py"
      - "backend/app/core/nova/creative_studio/casting_router_sandbox.py"
      - "backend/app/core/nova/creative_studio/casting_db_writes.py"
      - "backend/app/main.py"
      - "backend/app/db/session.py"
      - "backend/app/deployment/background_startup.py"
      - "docs/nova-casting-staging-checklist.md"
      - "backend/app/core/nova/creative_studio/casting_audit.py"
      - "backend/app/core/nova/creative_studio/casting_media_access.py"
      - "backend/app/core/nova/creative_studio/casting_access.py"
      - "backend/app/core/nova/creative_studio/casting_identity.py"
      - "backend/app/core/nova/creative_studio/casting_responses.py"
      - "backend/app/core/nova/creative_studio/casting_workflow_policy.py"
      - "backend/app/core/nova/creative_studio/casting_upload_rules.py"
      - "backend/app/core/nova/creative_studio/casting_policy.py"
      - "backend/app/core/nova/creative_studio/casting_db_models.py"
      - ".github/workflows/nova-casting-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casting_test
          POSTGRES_PASSWORD: casting_test
          POSTGRES_DB: casting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casting_test -d casting_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CASTING_TEST_POSTGRES_URL: postgresql+psycopg2://casting_test:casting_test@localhost:5432/casting_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standalone test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 sqlalchemy==2.0.44 alembic==1.17.0 psycopg2-binary==2.9.11
      - name: Verify casting preview safeguards
        run: python -m pytest --noconftest -q backend/tests/test_nova_casting_preview.py backend/tests/test_nova_casting_draft_schema.py backend/tests/test_nova_casting_migration_draft.py backend/tests/test_nova_casting_migration_execution.py backend/tests/test_nova_casting_content_migration.py backend/tests/test_nova_casting_two_migrations.py backend/tests/test_nova_casting_audit_consent.py backend/tests/test_nova_casting_policy.py backend/tests/test_nova_casting_upload_rules.py backend/tests/test_nova_casting_workflow_policy.py backend/tests/test_nova_casting_responses.py backend/tests/test_nova_casting_identity.py backend/tests/test_nova_casting_membership.py backend/tests/test_nova_casting_read_service.py backend/tests/test_nova_casting_router_draft.py backend/tests/test_nova_casting_db_reads.py backend/tests/test_nova_casting_access.py backend/tests/test_nova_casting_media_access.py backend/tests/test_nova_casting_audit.py backend/tests/test_nova_casting_flags.py backend/tests/test_nova_casting_intake_schema.py backend/tests/test_nova_casting_schema_guard.py backend/tests/test_nova_casting_schema_repair.py backend/tests/test_nova_casting_router_sandbox.py backend/tests/test_nova_casting_sandbox_page.py
      - name: Check casting browser JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.inside = True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.scripts.append(data)

          parsed = InlineScripts()
          for name in ("casting-preview.html", "casting-sandbox.html"):
              parsed = InlineScripts()
              parsed.feed(Path("backend/static/nova-creative") .joinpath(name).read_text(encoding="utf-8"))
              assert parsed.scripts, name + " script not found"
              target = Path("/tmp") / ("nova-" + name + ".js")
              target.write_text("\n".join(parsed.scripts), encoding="utf-8")
              print(target)
          PY
          node --check /tmp/nova-casting-preview.html.js
          node --check /tmp/nova-casting-sandbox.html.js

  casting-db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casting_test
          POSTGRES_PASSWORD: casting_test
          POSTGRES_DB: casting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casting_test -d casting_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://casting_test:casting_test@127.0.0.1:5432/casting_test
      CASTING_TEST_POSTGRES_URL: postgresql+psycopg2://casting_test:casting_test@127.0.0.1:5432/casting_test
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
      HEALTH_ISF_STRIPE_ENABLED: "false"
      NOVA_STRIPE_LIVE_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verify isolated casting PostgreSQL reads
        run: python -m pytest -q tests/test_nova_casting_db_reads_integration.py tests/test_nova_casting_router_http.py tests/test_nova_casting_sandbox_http.py
