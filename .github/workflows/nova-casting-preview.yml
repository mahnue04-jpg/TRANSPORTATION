name: Nova Casting Preview Checks

on:
  pull_request:
    paths:
      - "backend/static/nova-creative/index.html"
      - "backend/static/nova-creative/casting-preview.html"
      - "backend/tests/test_nova_casting_preview.py"
      - "backend/tests/test_nova_casting_draft_schema.py"
      - "backend/tests/test_nova_casting_migration_draft.py"
      - "backend/migrations/versions/20261010_casting_org_draft.py"
      - "backend/tests/test_nova_casting_policy.py"
      - "backend/tests/test_nova_casting_upload_rules.py"
      - "backend/tests/test_nova_casting_workflow_policy.py"
      - "backend/tests/test_nova_casting_responses.py"
      - "backend/tests/test_nova_casting_identity.py"
      - "backend/tests/test_nova_casting_membership.py"
      - "backend/app/core/nova/creative_studio/casting_membership.py"
      - "backend/tests/test_nova_casting_access.py"
      - "backend/tests/test_nova_casting_media_access.py"
      - "backend/tests/test_nova_casting_audit.py"
      - "backend/app/core/nova/creative_studio/casting_audit.py"
      - "backend/app/core/nova/creative_studio/casting_media_access.py"
      - "backend/app/core/nova/creative_studio/casting_access.py"
      - "backend/app/core/nova/creative_studio/casting_identity.py"
      - "backend/app/core/nova/creative_studio/casting_responses.py"
      - "backend/app/core/nova/creative_studio/casting_workflow_policy.py"
      - "backend/app/core/nova/creative_studio/casting_upload_rules.py"
      - "backend/app/core/nova/creative_studio/casting_policy.py"
      - "backend/app/core/nova/creative_studio/casting_db_models.py"
      - ".github/workflows/nova-casting-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standalone test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Verify casting preview safeguards
        run: python -m pytest --noconftest -q backend/tests/test_nova_casting_preview.py backend/tests/test_nova_casting_draft_schema.py backend/tests/test_nova_casting_migration_draft.py backend/tests/test_nova_casting_policy.py backend/tests/test_nova_casting_upload_rules.py backend/tests/test_nova_casting_workflow_policy.py backend/tests/test_nova_casting_responses.py backend/tests/test_nova_casting_identity.py backend/tests/test_nova_casting_membership.py backend/tests/test_nova_casting_access.py backend/tests/test_nova_casting_media_access.py backend/tests/test_nova_casting_audit.py
      - name: Check casting browser JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.inside = True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.scripts.append(data)

          parsed = InlineScripts()
          parsed.feed(Path("backend/static/nova-creative/casting-preview.html").read_text(encoding="utf-8"))
          assert parsed.scripts, "Audition preview script not found"
          Path("/tmp/nova-casting-preview.js").write_text("\n".join(parsed.scripts), encoding="utf-8")
          PY
          node --check /tmp/nova-casting-preview.js
