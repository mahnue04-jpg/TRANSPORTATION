name: Nova Stripe billing tests

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/app/core/nova/billing/**"
      - "backend/app/core/nova/signup/stripe_client.py"
      - "backend/tests/test_nova_stripe_subscriptions_phase1.py"
      - ".github/workflows/nova-stripe-billing-tests.yml"
  workflow_dispatch:

jobs:
  billing-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Nova Stripe billing regression tests
        env:
          DATABASE_URL: sqlite:///./test_nova_stripe_ci.db
        run: pytest tests/test_nova_stripe_subscriptions_phase1.py -q
