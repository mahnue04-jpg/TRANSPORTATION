name: Nova bookkeeping durable integration (synthetic)

on:
  push:
    branches:
      - nova/bookkeeping-durable-csv-integration-20261111
    paths:
      - "backend/app/core/nova/work_revenue/bookkeeping_*.py"
      - "backend/app/core/nova/work_revenue/operations_customer_csv_jobs.py"
      - "backend/app/core/nova/work_revenue/operations_owner_csv_api.py"
      - "backend/migrations/versions/20261111_nova_bookkeeping_consent.py"
      - "backend/scripts/nova_synthetic_bookkeeping_job.py"
      - "backend/scripts/nova_bookkeeping_release_preflight.py"
      - "backend/tests/test_nova_bookkeeping_restart_recovery.py"
      - "backend/tests/test_nova_bookkeeping_postgres_ci.py"
      - "backend/tests/test_nova_bookkeeping_*.py"
      - "backend/tests/test_nova_operations_customer_csv_jobs.py"
      - "backend/static/nova-work/index.html"
      - "backend/static/nova-work/bookkeeping.js"
      - "backend/tests/nova_bookkeeping_console.test.cjs"
      - "backend/tests/nova_bookkeeping_session.test.cjs"
      - "backend/migrations/versions/20261111_nova_bookkeeping_consent.py"
      - ".github/workflows/nova-bookkeeping-durable-integration.yml"
  pull_request:
    paths:
      - "backend/app/core/nova/work_revenue/bookkeeping_*.py"
      - "backend/app/core/nova/work_revenue/operations_customer_csv_jobs.py"
      - "backend/app/core/nova/work_revenue/operations_owner_csv_api.py"
      - "backend/migrations/versions/20261111_nova_bookkeeping_consent.py"
      - "backend/tests/test_nova_bookkeeping_*.py"
      - "backend/tests/test_nova_operations_customer_csv_jobs.py"
      - "backend/static/nova-work/index.html"
      - "backend/static/nova-work/bookkeeping.js"
      - "backend/tests/nova_bookkeeping_console.test.cjs"
      - "backend/tests/nova_bookkeeping_session.test.cjs"
      - "backend/scripts/nova_synthetic_bookkeeping_job.py"
      - ".github/workflows/nova-bookkeeping-durable-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bookkeeping-durable-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      TESTING: "true"
      APP_ENV: development
      AMICOR_ENVIRONMENT: development
      NOVA_OPERATIONS_DURABLE_CSV_ENABLED: "false"
      NOVA_BOOKKEEPING_DURABLE_ENABLED: "false"
      NOVA_STRIPE_LIVE_ENABLED: "false"
      HEALTH_ISF_STRIPE_ENABLED: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
      DATABASE_URL: sqlite:///./test_nova_bookkeeping_durable_ci.db
      ALLOWED_ORIGINS: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate Work & Revenue accounting console
        run: |
          node --check static/nova-work/bookkeeping.js
          node --test tests/nova_bookkeeping_console.test.cjs tests/nova_bookkeeping_session.test.cjs
      - name: Compile modified bookkeeping and CSV modules
        run: |
          python -m compileall -q app/core/nova/work_revenue/bookkeeping_*.py app/core/nova/work_revenue/operations_customer_csv_jobs.py app/core/nova/work_revenue/operations_owner_csv_api.py
      - name: Install backend test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run bookkeeping and existing CSV job regressions
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY ANTHROPIC_API_KEY
          python -m pytest -v -rs tests/test_nova_bookkeeping_durable_jobs.py tests/test_nova_bookkeeping_scope_http.py tests/test_nova_bookkeeping_restart_recovery.py tests/test_nova_bookkeeping_synthetic_http_flow.py tests/test_nova_bookkeeping_staging_preflight.py tests/test_nova_bookkeeping_retention.py tests/test_nova_bookkeeping_release_preflight_cli.py tests/test_nova_operations_customer_csv_jobs.py
          python -m unittest discover -s tests -p 'test_nova_bookkeeping_assignment.py' -v
          echo "Synthetic SQLite and simulated private-storage tests only. Dedicated Postgres CI and Moto S3 tests are separate. Render staging and real S3 remain UNVERIFIED." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify actual S3 adapter using isolated simulated S3
        run: |
          set -euo pipefail
          python -m pip install "moto[s3]>=5,<6" boto3
          python -m pytest -v -rs tests/test_nova_bookkeeping_s3_private.py
          echo "Actual boto3/S3PrivateDocumentStorage adapter exercised against Moto synthetic S3; NOT real AWS/Render S3." >> "$GITHUB_STEP_SUMMARY"
      - name: Produce sanitized OFFLINE accounting release gate report
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/nova_bookkeeping_release_preflight.py --output synthetic_out/nova_bookkeeping_release_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("synthetic_out/nova_bookkeeping_release_gate.json").read_text())
          assert result["status"] == "BLOCKED"
          assert result["production_release_authorized"] is False
          assert result["customer_data_allowed"] is False
          assert result["deployment_performed"] is False
          assert result["real_render_staging_checked"] is False
          print("Offline accounting release gate: BLOCKED as expected; no secrets or customer files.")
          PY
          echo "Accounting release gate: BLOCKED (correctly). Requires independently approved isolated Render staging and genuine customer consent." >> "$GITHUB_STEP_SUMMARY"
      - name: Execute three-task Nova synthetic bookkeeping assignment
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/nova_synthetic_bookkeeping_job.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("synthetic_out/synthetic_assignment_report.json").read_text())
          assert report["synthetic_jobs_completed"] == 3
          assert report["customer_data_used"] is False
          assert report["client_delivery_performed"] is False
          assert report["release_ready"] is False
          assert len({job["output_sha256"] for job in report["jobs"]}) == 3
          print("SYNTHETIC OPERATIONS ASSIGNMENT COMPLETE: 3 review-only workpapers")
          PY
          echo "Nova synthetic assignment: 3 mock jobs processed and approved for simulated owner download; NOT real customer work or production readiness." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-synthetic-bookkeeping-assignment
          path: backend/synthetic_out/
          retention-days: 7
          if-no-files-found: error

  bookkeeping-postgres-ephemeral:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova_bk_ci
          POSTGRES_PASSWORD: nova_bk_ci
          POSTGRES_DB: nova_bookkeeping_ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova_bk_ci -d nova_bookkeeping_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TESTING: "true"
      DATABASE_URL: sqlite:///./test_nova_bookkeeping_ci.db
      APP_ENV: development
      AMICOR_ENVIRONMENT: development
      NOVA_BOOKKEEPING_CI_POSTGRES_URL: postgresql+psycopg2://nova_bk_ci:nova_bk_ci@127.0.0.1:5432/nova_bookkeeping_ephemeral
      NOVA_BOOKKEEPING_DURABLE_ENABLED: "false"
      NOVA_OPERATIONS_DURABLE_CSV_ENABLED: "false"
      HEALTH_ISF_STRIPE_ENABLED: "false"
      NOVA_STRIPE_LIVE_ENABLED: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run actual ephemeral PostgreSQL migration, job and consent tests
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY ANTHROPIC_API_KEY
          python -m pytest -v -rs tests/test_nova_bookkeeping_postgres_ci.py
          echo "Ephemeral GitHub CI PostgreSQL and fake object storage, not Render staging or customer consent evidence." >> "$GITHUB_STEP_SUMMARY"
