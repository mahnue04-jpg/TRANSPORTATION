name: Nova receptionist staging booking service checks

on:
  pull_request:
    paths:
      - "backend/app/core/nova/growth_agent/service.py"
      - "backend/app/core/nova/growth_agent/router.py"
      - "backend/app/core/nova/growth_agent/schemas.py"
      - "backend/tests/test_nova_ga_staging_booking_service.py"
      - ".github/workflows/nova-ga-staging-booking-service-check.yml"

permissions:
  contents: read

jobs:
  fail-closed-staging-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTING: "true"
      DATABASE_URL: sqlite:///./test_nova_ga_staging_ci.db
      AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Staging test-service safety checks
        run: python -m pytest -q tests/test_nova_ga_staging_booking_service.py
