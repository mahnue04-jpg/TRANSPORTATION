name: Nova receptionist synthetic contact safety

on:
  pull_request:
    paths:
      - "backend/app/core/nova/growth_agent/service.py"
      - "backend/app/core/nova/growth_agent/router.py"
      - "backend/tests/test_nova_receptionist_synthetic_booking_contact.py"
      - ".github/workflows/nova-receptionist-synthetic-booking.yml"
  workflow_dispatch:

jobs:
  synthetic-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app/core/nova/growth_agent/service.py app/core/nova/growth_agent/router.py tests/test_nova_receptionist_synthetic_booking_contact.py
      - name: Synthetic contact tests (no external DB)
        run: python -m pytest -q tests/test_nova_receptionist_synthetic_booking_contact.py
