name: Render backend diagnostic

on:
  pull_request:
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/render-backend-diagnostic.yml"
  workflow_dispatch:

jobs:
  qualification-regression:
    runs-on: ubuntu-latest
    env:
      TESTING: "true"
      DATABASE_URL: sqlite:///./test_nova_qualification_ci.db
      AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
      HEALTH_ISF_STRIPE_ENABLED: "false"
      NOVA_STRIPE_LIVE_ENABLED: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Nova qualification regressions independently
        run: >-
          python -m pytest -q
          tests/test_nova_qualification_claim_scope.py
          tests/test_nova_capability_first_discovery.py
          tests/test_nova_international_match.py
          tests/test_nova_work_eligibility_explanations.py
          tests/test_nova_live_opportunity_qualification.py
          tests/test_nova_multi_source_discovery.py
          tests/test_nova_work_revenue_live_discovery_flag_bridge.py

  operations-csv-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      TESTING: "true"
      DATABASE_URL: sqlite:///./test_nova_operations_csv_pr_ci.db
      APP_ENV: development
      AMICOR_ENVIRONMENT: development
      NOVA_OPERATIONS_OWNER_CSV_ENABLED: "false"
      NOVA_OPERATIONS_DURABLE_CSV_ENABLED: "false"
      AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
      HEALTH_ISF_STRIPE_ENABLED: "false"
      NOVA_STRIPE_LIVE_ENABLED: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
      ALLOWED_ORIGINS: https://example.invalid
      AMICOR_PUBLIC_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify browser code syntax
        run: node --check static/nova-work/operations-csv.js
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run isolated CSV job API and recovery regressions
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY ANTHROPIC_API_KEY
          python -m pytest -q -rs \
            tests/test_nova_operations_csv_eligibility.py \
            tests/test_nova_operations_csv_http.py \
            tests/test_nova_operations_exact_claim_recovery.py \
            tests/test_nova_operations_atomic_completion.py \
            tests/test_nova_operations_csv_runner.py \
            tests/test_nova_operations_csv_offline_bridge.py \
            tests/test_nova_operations_customer_csv_jobs.py \
            tests/test_nova_operations_customer_csv_http.py \
            tests/test_nova_operations_durable_csv_ui_contract.py
          echo "CSV regressions use synthetic fixtures; not proof of production storage, real authorization, or customer-job readiness." >> "$GITHUB_STEP_SUMMARY"

  backend-diagnostic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amicor
          POSTGRES_PASSWORD: amicor
          POSTGRES_DB: amicor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amicor -d amicor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://amicor:amicor@127.0.0.1:5432/amicor
      APP_ENV: production
      AMICOR_ENVIRONMENT: production
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      HEALTH_ISF_STRIPE_ENABLED: "false"
      NOVA_STRIPE_LIVE_ENABLED: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
      ALLOWED_ORIGINS: https://example.invalid
      AMICOR_PUBLIC_URL: https://example.invalid
      APP_VERSION: diagnostic
      LOG_LEVEL: INFO

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Run Alembic upgrade
        run: alembic upgrade heads

      - name: Import app
        run: python -c "import app.main; print('app import ok')"

      - name: Test Ask Nova request behavior and weather parsing
        env:
          TESTING: "true"
          DATABASE_URL: sqlite:///./test_nova_today_ask_ci.db
          AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
        run: |
          node --test ../scripts/tests/nova-today-auth.test.cjs ../scripts/tests/nova-today-ask.test.cjs ../scripts/tests/nova-today-citations.test.cjs ../scripts/tests/nova-today-voice.test.cjs tests/nova_voice_pauses.test.cjs tests/nova_reasoning_context.test.cjs tests/nova_home_sources.test.cjs
          NOVA_AUTH_TEST_PAGE=nova-home node --test ../scripts/tests/nova-today-auth.test.cjs
          NOVA_AUTH_TEST_PAGE=nova-government node --test ../scripts/tests/nova-today-auth.test.cjs
          node --test tests/nova_government_questions.test.cjs
          node ../scripts/tests/nova-auth-rendered.cjs
          pytest tests/test_nova_government_discovery.py tests/test_nova_government_questions.py tests/test_nova_government_sources.py tests/test_nova_government_scope_review.py tests/test_nova_today_government_research.py tests/test_nova_reasoning_provider.py tests/test_nova_today_reasoning.py tests/test_nova_hosted_public_search.py tests/test_nova_today_live_tools.py tests/test_nova_today_current_information.py tests/test_nova_today_ask_transaction.py \
            tests/test_nova_today.py::test_nova_today_government_named_work_item_stays_grounded \
            tests/test_nova_today.py::test_nova_today_live_weather_news_and_web_paths \
            tests/test_nova_today.py::test_nova_today_natural_grant_request_uses_live_grounded_research \
            tests/test_nova_today.py::test_nova_today_grant_research_retries_with_relevance_filters -q

      - name: Check public government source retrieval (no AI calls)
        continue-on-error: true
        run: |
          python - <<'PYCODE'
          import json, time
          from app.core.nova.today.government_sources import retrieve_documents
          urls = ["https://www.acquisition.gov/far/32.501-1", "https://sam.gov/entity-registration", "https://www.sba.gov/Certifications/", "https://www.sba.gov/federal-contracting/contracting-assistance-programs/8a-business-development-program"]
          documents, gaps = retrieve_documents([{"url": url} for url in urls], ["acquisition.gov", "sam.gov", "sba.gov"], time.monotonic() + 8)
          for document in documents:
              print(json.dumps({"url": document["url"], "title": document["title"], "paragraphs": len(document["paragraphs"]), "preview": [text[:300] for text in document["paragraphs"][:3]]}))
          print(json.dumps({"readable_sources": len(documents), "unreadable_sources": gaps}))
          if not any("acquisition.gov" in document["url"] for document in documents):
              raise SystemExit("Current FAR source retrieval could not be confirmed")
          PYCODE

      - name: Run Nova Stripe billing regression
        env:
          DATABASE_URL: sqlite:///./test_nova_stripe_ci.db
        run: pytest tests/test_nova_stripe_subscriptions_phase1.py -q

      - name: Test casting authenticated database reads in disposable PostgreSQL
        env:
          CASTING_TEST_POSTGRES_URL: postgresql+psycopg2://amicor:amicor@127.0.0.1:5432/amicor
        run: pytest tests/test_nova_casting_db_reads_integration.py tests/test_nova_casting_router_http.py tests/test_nova_casting_sandbox_http.py tests/test_nova_casting_private_media_http.py -q

      - name: Run Creative Studio scene timeout and rendering regression
        env:
          DATABASE_URL: sqlite:///./test_nova_creative_ci.db
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          pytest tests/test_nova_creative_studio.py tests/test_nova_creative_scene_jobs.py tests/test_nova_creative_issue_344.py tests/test_nova_creative_offline_commercial.py tests/test_presenter_media.py -q
          node --test static/nova-creative/creative-jobs.test.cjs

      - name: Run Nova cross-page discovery and status evidence regression
        env:
          DATABASE_URL: sqlite:///./test_nova_revenue_intent_ci.db
          AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
        run: |
          pytest tests/test_nova_revenue_intent_status.py tests/test_nova_core.py tests/test_nova_workspace.py tests/test_nova_business.py -q
          node --test static/nova-workspace/revenue-links.test.cjs
          node --test tests/nova_workspace_ui.test.cjs tests/nova_multilingual_ui.test.cjs
          pytest tests/test_nova_workspace_transfer.py tests/test_nova_workspace_languages.py -q

      - name: Run Nova Work & Revenue regression
        env:
          DATABASE_URL: sqlite:///./test_nova_work_revenue_ci.db
          AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
        run: |
          set -e
          for test_file in \
            tests/test_nova_work_revenue.py \
            tests/test_nova_work_revenue_completion.py \
            tests/test_nova_work_revenue_v2.py \
            tests/test_nova_work_revenue_live_discovery_flag_bridge.py \
            tests/test_nova_work_autopilot_cycle.py \
            tests/test_nova_live_opportunity_qualification.py \
            tests/test_nova_capability_first_discovery.py \
            tests/test_nova_international_match.py \
            tests/test_nova_work_eligibility_explanations.py \
            tests/test_nova_multi_source_discovery.py \
            tests/test_nova_sam_gov_discovery.py \
            tests/test_nova_capability_catalog.py \
            tests/test_nova_execution_playbooks.py \
            tests/test_nova_work_packets.py \
            tests/test_nova_autonomous_execution.py \
            tests/test_nova_application_review.py \
            tests/test_nova_work_revenue_block5.py \
            tests/test_nova_work_revenue_labeling.py \
            tests/test_nova_work_revenue_operator_ui.py \
            tests/test_nova_work_revenue_owner_facts.py \
            tests/test_nova_work_revenue_simulated_ingest_guard.py \
            tests/test_nova_work_revenue_v2_hardening.py \
            tests/test_nova_work_revenue_v2_migration.py
          do
            rm -f test_nova_work_revenue_ci.db
            echo "=== Running $test_file with a fresh isolated test database ==="
            pytest "$test_file" -q
          done

      - name: Run AMICOR Marketplace regression
        env:
          DATABASE_URL: sqlite:///./test_nova_marketplace_ci.db
          AMICOR_MARKETPLACE_PRIVATE_DIR: /tmp/amicor-marketplace-private
        run: |
          rm -f test_nova_marketplace_ci.db
          pytest tests/test_nova_marketplace_files.py tests/test_nova_marketplace_checkout.py -q

      - name: Start app and probe readiness
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8011 > /tmp/amicor.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do
            status=$(curl -sS -o /tmp/readiness.json -w "%{http_code}" http://127.0.0.1:8011/api/health/readiness || true)
            if [ "$status" = "200" ]; then
              cat /tmp/readiness.json
              kill $pid || true
              exit 0
            fi
            sleep 1
          done
          echo "Final readiness response:"
          cat /tmp/readiness.json || true
          echo
          echo "Application log:"
          cat /tmp/amicor.log
          kill $pid || true
          exit 1

