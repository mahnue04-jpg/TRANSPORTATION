name: Work and Revenue regression

# Independent of Render backend diagnostic. Creative Studio and Workspace
# failures in that workflow must not skip these results.
# Disposable sqlite only. No credentials. No application submission.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/work-revenue-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-revenue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    name: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run qualification on a disposable database
        env:
          TESTING: "true"
          DATABASE_URL: sqlite:///./test_nova_qualification_ci.db
          APP_ENV: production
          AMICOR_ENVIRONMENT: production
          DB_POOL_SIZE: "5"
          DB_MAX_OVERFLOW: "5"
          AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
          HEALTH_ISF_STRIPE_ENABLED: "false"
          NOVA_STRIPE_LIVE_ENABLED: "false"
          SECRET_KEY: ci-only-placeholder
          JWT_SECRET: ci-only-placeholder
          ALLOWED_ORIGINS: https://example.invalid
          AMICOR_PUBLIC_URL: https://example.invalid
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY HEALTH_ISF_STRIPE_SECRET_KEY NOVA_STRIPE_SECRET_KEY ANTHROPIC_API_KEY
          db=test_nova_qualification_ci.db
          failed=0
          ran=0
          {
            echo "### Qualification"
            echo "Disposable sqlite file: \`$db\`. No credentials. No application submission."
          } >> "$GITHUB_STEP_SUMMARY"
          for test_file in \
            tests/test_nova_qualification_claim_scope.py \
            tests/test_nova_capability_first_discovery.py \
            tests/test_nova_live_opportunity_qualification.py \
            tests/test_nova_multi_source_discovery.py \
            tests/test_nova_work_revenue_live_discovery_flag_bridge.py
          do
            if [ ! -f "$test_file" ]; then
              echo "MISSING_REQUIRED $test_file"
              echo "- fail: \`$test_file\` missing" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              continue
            fi
            rm -f "$db" "${db}-journal" "${db}-wal" "${db}-shm"
            echo "=== $test_file disposable sqlite $db ==="
            set +e
            output=$(python -m pytest "$test_file" -q --tb=line)
            code=$?
            set -e
            printf '%s\n' "$output"
            summary=$(printf '%s\n' "$output" | awk 'NF{line=$0} END{print line}')
            if [ "$code" -eq 0 ]; then
              ran=$((ran + 1))
              echo "- pass: \`$test_file\` — ${summary}" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              echo "- fail: \`$test_file\` — ${summary} (exit ${code})" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          rm -f "$db" "${db}-journal" "${db}-wal" "${db}-shm"
          echo "QUALIFICATION_FILES_RAN=${ran} QUALIFICATION_FILES_FAILED=${failed}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualification files ran: ${ran}. Failed: ${failed}." >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0

  country-eligibility:
    name: country-eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run country eligibility on a disposable database
        env:
          TESTING: "true"
          DATABASE_URL: sqlite:///./test_nova_country_eligibility_ci.db
          APP_ENV: production
          AMICOR_ENVIRONMENT: production
          DB_POOL_SIZE: "5"
          DB_MAX_OVERFLOW: "5"
          AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
          HEALTH_ISF_STRIPE_ENABLED: "false"
          NOVA_STRIPE_LIVE_ENABLED: "false"
          SECRET_KEY: ci-only-placeholder
          JWT_SECRET: ci-only-placeholder
          ALLOWED_ORIGINS: https://example.invalid
          AMICOR_PUBLIC_URL: https://example.invalid
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY HEALTH_ISF_STRIPE_SECRET_KEY NOVA_STRIPE_SECRET_KEY ANTHROPIC_API_KEY
          db=test_nova_country_eligibility_ci.db
          failed=0
          ran=0
          absent=0
          {
            echo "### Country eligibility"
            echo "Disposable sqlite file: \`$db\`. Files land with draft #313. Absence is reported and does not hide a failure of a file that is present."
          } >> "$GITHUB_STEP_SUMMARY"
          for test_file in \
            tests/test_nova_international_match.py \
            tests/test_nova_work_eligibility_explanations.py
          do
            if [ ! -f "$test_file" ]; then
              echo "COUNTRY_ELIGIBILITY_ABSENT $test_file"
              echo "- absent: \`$test_file\`" >> "$GITHUB_STEP_SUMMARY"
              absent=$((absent + 1))
              continue
            fi
            rm -f "$db" "${db}-journal" "${db}-wal" "${db}-shm"
            echo "=== $test_file disposable sqlite $db ==="
            set +e
            output=$(python -m pytest "$test_file" -q --tb=line)
            code=$?
            set -e
            printf '%s\n' "$output"
            summary=$(printf '%s\n' "$output" | awk 'NF{line=$0} END{print line}')
            if [ "$code" -eq 0 ]; then
              ran=$((ran + 1))
              echo "- pass: \`$test_file\` — ${summary}" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              echo "- fail: \`$test_file\` — ${summary} (exit ${code})" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          rm -f "$db" "${db}-journal" "${db}-wal" "${db}-shm"
          if [ "$ran" -eq 0 ]; then
            echo "COUNTRY_ELIGIBILITY_SKIPPED=files_not_on_branch"
            echo "::notice::Country eligibility tests are not on this branch. They run when draft #313 files are present."
          fi
          echo "COUNTRY_ELIGIBILITY_FILES_RAN=${ran} COUNTRY_ELIGIBILITY_FILES_FAILED=${failed} COUNTRY_ELIGIBILITY_FILES_ABSENT=${absent}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Country eligibility files ran: ${ran}. Failed: ${failed}. Absent: ${absent}." >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0

  work-and-revenue:
    name: work-and-revenue
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Work and Revenue on isolated disposable databases
        env:
          TESTING: "true"
          DATABASE_URL: sqlite:///./test_nova_work_revenue_ci.db
          APP_ENV: production
          AMICOR_ENVIRONMENT: production
          DB_POOL_SIZE: "5"
          DB_MAX_OVERFLOW: "5"
          AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
          HEALTH_ISF_STRIPE_ENABLED: "false"
          NOVA_STRIPE_LIVE_ENABLED: "false"
          SECRET_KEY: ci-only-placeholder
          JWT_SECRET: ci-only-placeholder
          ALLOWED_ORIGINS: https://example.invalid
          AMICOR_PUBLIC_URL: https://example.invalid
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY HEALTH_ISF_STRIPE_SECRET_KEY NOVA_STRIPE_SECRET_KEY ANTHROPIC_API_KEY
          db=test_nova_work_revenue_ci.db
          failed=0
          ran=0
          {
            echo "### Work and Revenue"
            echo "Each file gets a fresh \`$db\`. In-process tests only. No credentials and no application submission."
          } >> "$GITHUB_STEP_SUMMARY"
          for test_file in \
            tests/test_nova_work_revenue.py \
            tests/test_nova_work_revenue_completion.py \
            tests/test_nova_work_revenue_v2.py \
            tests/test_nova_work_revenue_live_discovery_flag_bridge.py \
            tests/test_nova_work_autopilot_cycle.py \
            tests/test_nova_live_opportunity_qualification.py \
            tests/test_nova_capability_first_discovery.py \
            tests/test_nova_multi_source_discovery.py \
            tests/test_nova_sam_gov_discovery.py \
            tests/test_nova_capability_catalog.py \
            tests/test_nova_execution_playbooks.py \
            tests/test_nova_work_packets.py \
            tests/test_nova_autonomous_execution.py \
            tests/test_nova_application_review.py \
            tests/test_nova_work_revenue_block5.py \
            tests/test_nova_work_revenue_labeling.py \
            tests/test_nova_work_revenue_operator_ui.py \
            tests/test_nova_work_revenue_owner_facts.py \
            tests/test_nova_work_revenue_simulated_ingest_guard.py \
            tests/test_nova_work_revenue_v2_hardening.py \
            tests/test_nova_work_revenue_v2_migration.py
          do
            if [ ! -f "$test_file" ]; then
              echo "MISSING_REQUIRED $test_file"
              echo "- fail: \`$test_file\` missing" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              continue
            fi
            rm -f "$db" "${db}-journal" "${db}-wal" "${db}-shm"
            echo "=== $test_file disposable sqlite $db ==="
            set +e
            output=$(python -m pytest "$test_file" -q --tb=line)
            code=$?
            set -e
            printf '%s\n' "$output"
            summary=$(printf '%s\n' "$output" | awk 'NF{line=$0} END{print line}')
            if [ "$code" -eq 0 ]; then
              ran=$((ran + 1))
              echo "- pass: \`$test_file\` — ${summary}" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              echo "- fail: \`$test_file\` — ${summary} (exit ${code})" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          rm -f "$db" "${db}-journal" "${db}-wal" "${db}-shm"
          echo "WORK_REVENUE_FILES_RAN=${ran} WORK_REVENUE_FILES_FAILED=${failed}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Work and Revenue files ran: ${ran}. Failed: ${failed}." >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
