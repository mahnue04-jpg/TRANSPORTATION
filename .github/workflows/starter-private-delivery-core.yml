name: Starter private delivery core

on:
  pull_request:
    paths:
      - "backend/app/core/nova/work_revenue/operations_customer_delivery.py"
      - "backend/app/core/nova/work_revenue/operations_customer_csv_jobs.py"
      - "backend/app/core/nova/work_revenue/operations_owner_csv_api.py"
      - "backend/app/core/nova/work_revenue/operations_csv_cleanup.py"
      - "backend/app/core/nova/work_revenue/owner_auth.py"
      - "backend/tests/test_operations_starter_private_delivery_core.py"
      - ".github/workflows/starter-private-delivery-core.yml"
  workflow_dispatch:

jobs:
  delivery-fail-closed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify unconfigured customer delivery stays closed
        run: python -m pytest -q tests/test_operations_starter_private_delivery_core.py
