name: Starter verified PaymentIntent tests

on:
  push:
    branches:
      - "review/starter-49-verified-payment-intent-20261122"
    paths:
      - "backend/app/modules/marketing/routes.py"
      - "backend/app/modules/marketing/starter_payment_intent.py"
      - "backend/tests/test_operations_starter_signed_webhook.py"
      - ".github/workflows/starter-verified-payment-intent.yml"
  pull_request:
    paths:
      - "backend/app/modules/marketing/routes.py"
      - "backend/app/modules/marketing/starter_payment_intent.py"
      - "backend/tests/test_operations_starter_signed_webhook.py"
      - ".github/workflows/starter-verified-payment-intent.yml"
  workflow_dispatch:

jobs:
  signed-payment-intent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NOVA_STRIPE_LIVE_ENABLED: "false"
      HEALTH_ISF_STRIPE_ENABLED: "false"
      TESTING: "true"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend tests
        run: python -m pip install -r requirements.txt pytest
      - name: Verify signed checkout requires matching PaymentIntent
        run: python -m pytest -q tests/test_operations_starter_signed_webhook.py tests/test_operations_starter_refund_match.py
