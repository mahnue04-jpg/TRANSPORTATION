name: Nova Growth Agent

# Isolated from Work & Revenue and Creative Studio workflows.
# Disposable sqlite only. No credentials. No live messaging.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/core/nova/growth_agent/**"
      - "backend/static/nova-growth/**"
      - "backend/migrations/versions/20261112_nova_growth_agent.py"
      - "backend/migrations/versions/20261112_nova_growth_agent_worker.py"
      - "backend/tests/test_nova_growth_agent_*.py"
      - "docs/nova/growth-agent/**"
      - ".github/workflows/nova-growth-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-growth-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  growth-agent:
    name: growth-agent-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Growth Agent tests
        env:
          TESTING: "true"
          DATABASE_URL: sqlite:///./test_nova_growth_agent_ci.db
          APP_ENV: test
          AMICOR_ENVIRONMENT: test
          NOVA_GROWTH_AGENT_ENABLED: "true"
          NOVA_GROWTH_AGENT_DEMO_MODE: "true"
          NOVA_GROWTH_AGENT_WIDGET_ENABLED: "true"
          NOVA_GROWTH_AGENT_WIDGET_SECRET: ci-widget-secret
          NOVA_STRIPE_LIVE_ENABLED: "false"
          SECRET_KEY: ci-only-placeholder
          JWT_SECRET: ci-only-placeholder
          ALLOWED_ORIGINS: https://example.invalid
          AMICOR_PUBLIC_URL: https://example.invalid
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY \
            HEALTH_ISF_STRIPE_SECRET_KEY NOVA_STRIPE_SECRET_KEY ANTHROPIC_API_KEY \
            TWILIO_AUTH_TOKEN TWILIO_ACCOUNT_SID
          python -m pytest -q \
            tests/test_nova_growth_agent_unit.py \
            tests/test_nova_growth_agent_integration.py \
            tests/test_nova_growth_agent_security.py \
            tests/test_nova_growth_agent_http.py \
            tests/test_nova_growth_agent_worker_retention.py
