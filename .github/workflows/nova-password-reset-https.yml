name: Nova Password Reset HTTPS Regression

on:
  pull_request:
    paths:
      - 'backend/app/password_reset_service.py'
      - 'backend/tests/test_password_reset_https_delivery.py'
      - 'backend/tests/test_nova_customer_password_reset.py'
      - 'backend/tests/test_password_reset_postgres_concurrency.py'
      - '.github/workflows/nova-password-reset-https.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-reset-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install Python requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Verify syntax
        run: python -m compileall -q backend/app/password_reset_service.py backend/tests/test_password_reset_https_delivery.py
      - name: Run offline reset-email tests
        env:
          PYTHONPATH: backend
          APP_ENV: test
          AMICOR_PASSWORD_RESET_TEST_CAPTURE: 'false'
        run: python -m pytest -q backend/tests/test_password_reset_https_delivery.py backend/tests/test_nova_customer_password_reset.py

  password-reset-postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reset_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: reset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reset_test -d reset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install Python requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Test concurrent reset-email finalization on disposable PostgreSQL
        env:
          PYTHONPATH: backend
          APP_ENV: test
          PASSWORD_RESET_TEST_POSTGRES_URL: postgresql+psycopg2://reset_test:local-ci-only@localhost:5432/reset_test
        run: python -m pytest -q backend/tests/test_password_reset_postgres_concurrency.py
