name: Nova Password Reset HTTPS Regression

on:
  pull_request:
    paths:
      - 'backend/app/password_reset_service.py'
      - 'backend/tests/test_password_reset_https_delivery.py'
      - '.github/workflows/nova-password-reset-https.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  password-reset-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install Python requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Verify syntax
        run: python -m compileall -q backend/app/password_reset_service.py backend/tests/test_password_reset_https_delivery.py
      - name: Run offline reset-email tests
        env:
          PYTHONPATH: backend
          APP_ENV: test
          AMICOR_PASSWORD_RESET_TEST_CAPTURE: 'false'
        run: python -m pytest -q backend/tests/test_password_reset_https_delivery.py
