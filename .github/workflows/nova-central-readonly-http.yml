name: Nova Central read-only Workspace HTTP gate

on:
  pull_request:
    branches:
      - ci/fix-render-backend-python-runner-20261117
    paths:
      - "backend/app/core/nova/workspace/central_journey_readonly.py"
      - "backend/app/core/nova/workspace/router.py"
      - "backend/tests/test_nova_central_workspace_readonly.py"
      - ".github/workflows/nova-central-readonly-http.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      AMICOR_ENVIRONMENT: test
      APP_ENV: test
      NOVA_CENTRAL_JOURNEY_READONLY_ENABLED: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and test read-only HTTP boundary
        run: |
          python -m py_compile app/core/nova/workspace/central_journey_readonly.py app/core/nova/workspace/router.py tests/test_nova_central_workspace_readonly.py
          python -m pytest tests/test_nova_central_workspace_readonly.py -q --tb=short --noconftest
