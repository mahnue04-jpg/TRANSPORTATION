name: Nova Offline Durability Tests

on:
  pull_request:
    paths:
      - 'backend/app/core/nova/work_revenue/shared_evidence.py'
      - 'backend/app/core/nova/work_revenue/operations_job_queue.py'
      - 'backend/app/core/nova/work_revenue/operations_assignment_handoff.py'
      - 'backend/tests/test_nova_operations_assignment_handoff.py'
      - 'backend/app/core/nova/work_revenue/operations_release_gate.py'
      - 'backend/tests/test_nova_operations_release_gate.py'
      - 'backend/tests/test_nova_operations_integrated_handoff_acceptance.py'
      - 'backend/app/core/nova/work_revenue/operations_owner_scope.py'
      - 'backend/app/core/nova/work_revenue/operations_authenticated_handoff.py'
      - 'backend/tests/test_nova_operations_authenticated_handoff.py'
      - 'backend/app/core/nova/work_revenue/operations_staging_boundary.py'
      - 'backend/tests/test_nova_operations_staging_boundary.py'
      - 'backend/tests/test_nova_shared_evidence.py'
      - 'backend/tests/test_nova_operations_job_queue.py'
      - 'backend/app/core/nova/work_revenue/operations_csv_cleanup.py'
      - 'backend/tests/test_nova_operations_csv_cleanup.py'
      - 'backend/app/core/nova/work_revenue/operations_csv_runner.py'
      - 'backend/tests/test_nova_operations_csv_runner.py'
      - 'backend/app/core/nova/work_revenue/operations_artifact_review.py'
      - 'backend/tests/test_nova_operations_artifact_review.py'
      - 'backend/tests/test_nova_operations_atomic_completion.py'
      - 'backend/tests/test_nova_operations_offline_assignment_acceptance.py'
      - 'backend/tests/test_nova_operations_exact_claim_recovery.py'
      - 'backend/tests/test_nova_operations_runner_storage_failure.py'
      - 'backend/scripts/nova_operations_synthetic_demo.py'
      - 'backend/app/core/nova/work_revenue/operations_synthetic_http.py'
      - 'backend/tests/test_nova_operations_synthetic_http.py'
      - '.github/workflows/nova-offline-durability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<9' 'fastapi>=0.100,<1' 'sqlalchemy>=2,<3' 'httpx>=0.27,<1'
      - name: Run available offline Nova contract tests
        working-directory: backend
        run: |
          set -eu
          files=""
          for f in tests/test_nova_shared_evidence.py tests/test_nova_operations_job_queue.py tests/test_nova_operations_assignment_handoff.py tests/test_nova_operations_release_gate.py tests/test_nova_operations_integrated_handoff_acceptance.py tests/test_nova_operations_authenticated_handoff.py tests/test_nova_operations_staging_boundary.py tests/test_nova_operations_csv_cleanup.py tests/test_nova_operations_csv_runner.py tests/test_nova_operations_artifact_review.py tests/test_nova_operations_atomic_completion.py tests/test_nova_operations_offline_assignment_acceptance.py tests/test_nova_operations_exact_claim_recovery.py tests/test_nova_operations_runner_storage_failure.py tests/test_nova_operations_synthetic_http.py; do
            if [ -f "$f" ]; then files="$files $f"; fi
          done
          test -n "$files"
          PYTHONPATH=. python -m pytest --noconftest -q $files
      - name: Execute synthetic owner-reviewed CSV deliverable
        working-directory: backend
        run: |
          PYTHONPATH=. python -m scripts.nova_operations_synthetic_demo --output-dir ../nova-demo-artifacts
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('../nova-demo-artifacts')
          report = json.loads((root / 'nova_synthetic_acceptance.json').read_text())
          with (root / 'nova_synthetic_cleaned.csv').open(newline='') as stream:
              rows = list(csv.reader(stream))
          assert rows == [['Name', 'Department'], ['Ada', 'Operations'], ['Mina', 'Research']]
          assert report['review_state'] == 'approved_by_synthetic_fixture'
          assert report['external_delivery_performed'] is False
          assert report['customer_upload_enabled'] is False
          print('Synthetic CSV acceptance succeeded without network, customer data, or release.')
          PY
      - name: Publish synthetic CSV and acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: nova-synthetic-offline-acceptance
          path: nova-demo-artifacts/
          if-no-files-found: error
          retention-days: 7
