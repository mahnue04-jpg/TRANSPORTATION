name: Nova Offline Durability Tests

on:
  pull_request:
    paths:
      - 'backend/app/core/nova/work_revenue/shared_evidence.py'
      - 'backend/app/core/nova/work_revenue/operations_job_queue.py'
      - 'backend/tests/test_nova_shared_evidence.py'
      - 'backend/tests/test_nova_operations_job_queue.py'
      - '.github/workflows/nova-offline-durability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Run available offline Nova contract tests
        working-directory: backend
        run: |
          set -eu
          files=""
          for f in tests/test_nova_shared_evidence.py tests/test_nova_operations_job_queue.py; do
            if [ -f "$f" ]; then files="$files $f"; fi
          done
          test -n "$files"
          PYTHONPATH=. python -m pytest -q $files
