name: Studio finished MP4 import
on:
  pull_request:
    paths:
      - 'backend/static/nova-creative/**'
      - 'backend/app/core/nova/creative_studio/router.py'
      - 'backend/app/core/nova/creative_studio/service.py'
      - 'backend/tests/test_nova_finished_video_import.py'
      - '.github/workflows/studio-finished-import.yml'
  workflow_dispatch:
jobs:
  import-contract:
    runs-on: ubuntu-latest
    env:
      TESTING: 'true'
      DATABASE_URL: sqlite:///./test_studio_import.db
      AMICOR_RESTRICT_SEED_ACCOUNTS: 'false'
      HEALTH_ISF_STRIPE_ENABLED: 'false'
      NOVA_STRIPE_LIVE_ENABLED: 'false'
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check import UI and project-switch behavior
        run: node --test backend/static/nova-creative/creative-import.test.cjs backend/static/nova-creative/creative-jobs.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Check authenticated import and byte-preserving download
        working-directory: backend
        run: python -m pytest tests/test_nova_finished_video_import.py -q
