name: Nova Operations CSV selector verification

on:
  push:
    branches:
      - feat/nova-saved-task-selector-issue-476
    paths:
      - "backend/app/core/nova/work_revenue/operations_owner_csv_api.py"
      - "backend/tests/test_nova_operations_csv_eligibility.py"
      - "backend/tests/test_nova_operations_csv_http.py"
      - "backend/app/core/nova/work_revenue/service.py"
      - "backend/app/core/nova/work_revenue/operations_job_queue.py"
      - "backend/app/core/nova/work_revenue/operations_csv_runner.py"
      - "backend/app/core/nova/work_revenue/operations_csv_offline_bridge.py"
      - "backend/tests/test_nova_operations_csv_offline_bridge.py"
      - "backend/app/core/nova/work_revenue/operations_artifact_review.py"
      - "backend/tests/test_nova_operations_exact_claim_recovery.py"
      - "backend/tests/test_nova_operations_atomic_completion.py"
      - "backend/tests/test_nova_operations_csv_runner.py"
      - "backend/static/nova-work/operations-csv.js"
      - "backend/static/nova-work/index.html"
      - ".github/workflows/nova-operations-csv-selector-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eligibility-and-ui-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      TESTING: "true"
      DATABASE_URL: sqlite:///./test_nova_operations_csv_selector_ci.db
      APP_ENV: development
      AMICOR_ENVIRONMENT: development
      NOVA_OPERATIONS_OWNER_CSV_ENABLED: "false"
      HEALTH_ISF_STRIPE_ENABLED: "false"
      NOVA_STRIPE_LIVE_ENABLED: "false"
      AMICOR_RESTRICT_SEED_ACCOUNTS: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
      ALLOWED_ORIGINS: https://example.invalid
      AMICOR_PUBLIC_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify CSV UI JavaScript syntax
        run: node --check static/nova-work/operations-csv.js
      - name: Check Python syntax
        run: |
          python -m py_compile app/core/nova/work_revenue/operations_owner_csv_api.py app/core/nova/work_revenue/service.py tests/test_nova_operations_csv_eligibility.py tests/test_nova_operations_csv_http.py
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run isolated CSV eligibility regression cases
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY ANTHROPIC_API_KEY
          test -f tests/test_nova_operations_csv_eligibility.py
          test -f tests/test_nova_operations_csv_http.py
          python -m pytest -v -rs tests/test_nova_operations_csv_eligibility.py tests/test_nova_operations_csv_http.py tests/test_nova_operations_exact_claim_recovery.py tests/test_nova_operations_atomic_completion.py tests/test_nova_operations_csv_runner.py tests/test_nova_operations_csv_offline_bridge.py
          echo "CSV selector tests are synthetic eligibility tests only, not an HTTP/staging or customer-data readiness certification." >> "$GITHUB_STEP_SUMMARY"
