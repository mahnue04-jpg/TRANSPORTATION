name: Nova bookkeeping workpaper tests

on:
  pull_request:
    paths:
      - 'backend/app/core/nova/work_revenue/bookkeeping_workpaper.py'
      - 'backend/tests/test_nova_bookkeeping_workpaper.py'
      - 'backend/tests/test_nova_bookkeeping_qualification.py'
      - 'backend/app/core/nova/v3/capability_catalog.py'
      - '.github/workflows/nova-bookkeeping-workpaper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bookkeeping-workpaper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated synthetic workpaper regressions
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend/tests -p 'test_nova_bookkeeping_workpaper.py' -v
          python -m unittest discover -s backend/tests -p 'test_nova_bookkeeping_qualification.py' -v
