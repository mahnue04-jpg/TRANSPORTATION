name: Nova Growth owner session UI checks

on:
  pull_request:
    paths:
      - "backend/static/nova-growth/growth.js"
      - "backend/static/nova-growth/growth.css"
      - "backend/static/nova-growth/index.html"
      - "backend/static/nova-growth/growth-session.test.cjs"
      - "backend/static/nova-growth/owner-copy.test.cjs"
      - "backend/static/nova-growth/test-booking-crm.test.cjs"
      - "backend/static/nova-growth/booking-slots.js"
      - "backend/static/nova-growth/booking-slots.test.cjs"
      - "backend/static/nova-growth/demo-booking-selection.test.cjs"
      - "backend/static/nova-growth/synthetic-contact.test.cjs"
      - "backend/static/nova-growth/owner-booking-feedback.test.cjs"
      - "backend/app/core/nova/growth_agent/service.py"
      - "backend/app/core/nova/growth_agent/router.py"
      - "backend/app/core/nova/growth_agent/schemas.py"
      - "backend/tests/test_nova_ga_staging_booking_service.py"
      - ".github/workflows/nova-growth-session-ui-check.yml"
  push:
    branches:
      - fix/nova-growth-session-chat-labels-20261116
    paths:
      - "backend/static/nova-growth/**"
      - ".github/workflows/nova-growth-session-ui-check.yml"

permissions:
  contents: read

jobs:
  ui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check backend/static/nova-growth/growth.js
          node --check backend/static/nova-growth/receptionist.js
          node --check backend/static/nova-growth/growth-session.test.cjs
          node --check backend/static/nova-growth/owner-copy.test.cjs
          node --check backend/static/nova-growth/test-booking-crm.test.cjs
          node --check backend/static/nova-growth/booking-slots.js
          node --check backend/static/nova-growth/booking-slots.test.cjs
          node --check backend/static/nova-growth/demo-booking-selection.test.cjs
          node --check backend/static/nova-growth/synthetic-contact.test.cjs
          node --check backend/static/nova-growth/owner-booking-feedback.test.cjs
      - name: Owner session UI tests
        run: node --test backend/static/nova-growth/growth-session.test.cjs
      - name: Owner-friendly copy checks
        run: node --test backend/static/nova-growth/owner-copy.test.cjs
      - name: Safe staging appointment slot tests
        run: node --test backend/static/nova-growth/booking-slots.test.cjs
      - name: Synthetic CRM selection checks
        run: node --test backend/static/nova-growth/test-booking-crm.test.cjs
      - name: Synthetic customer fixture UI checks
        run: node --test backend/static/nova-growth/synthetic-contact.test.cjs
      - name: Synthetic CRM booking selection checks
        run: node --test backend/static/nova-growth/demo-booking-selection.test.cjs
      - name: Owner booking feedback checks
        run: node --test backend/static/nova-growth/owner-booking-feedback.test.cjs
      - name: Receptionist UI regression tests
        run: node --test backend/static/nova-growth/receptionist.test.cjs
