name: Starter refund-event matching tests

on:
  push:
    branches:
      - "review/starter-49-refund-event-match-20261122"
    paths:
      - "backend/app/modules/marketing/starter_refund_match.py"
      - "backend/tests/test_operations_starter_refund_match.py"
      - ".github/workflows/starter-refund-event-match.yml"
  pull_request:
    paths:
      - "backend/app/modules/marketing/starter_refund_match.py"
      - "backend/tests/test_operations_starter_refund_match.py"
      - ".github/workflows/starter-refund-event-match.yml"
  workflow_dispatch:

jobs:
  refund-match:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check exact refund and dispute PaymentIntent matching
        run: python -m pytest -q tests/test_operations_starter_refund_match.py
