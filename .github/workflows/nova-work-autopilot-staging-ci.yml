name: Nova Work Revenue Staging Autopilot Acceptance

# Tests ONLY. It does not schedule a job, deploy a service or contact providers.
on:
  pull_request:
    paths:
      - "backend/app/core/nova/v3/scheduled_autopilot.py"
      - "backend/app/core/nova/v3/autopilot_staging_guard.py"
      - "backend/app/core/nova/v3/autopilot_cycle.py"
      - "backend/scripts/nova_work_autopilot_staging.py"
      - "backend/tests/test_nova_work_autopilot_postgres_ci.py"
      - ".github/workflows/nova-work-autopilot-staging-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-autopilot-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: nova_discovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova_ci -d nova_discovery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CI: "true"
      TESTING: "true"
      DATABASE_URL: sqlite:///./test_nova_staging_autopilot_ci.db
      NOVA_WORK_AUTOPILOT_CI_POSTGRES_URL: postgresql+psycopg2://nova_ci:synthetic_ci_only@127.0.0.1:5432/nova_discovery_ci
      APP_ENV: staging
      AMICOR_ENVIRONMENT: staging
      NOVA_WORK_AUTOPILOT_STAGING_ENABLED: "false"
      HEALTH_ISF_STRIPE_ENABLED: "false"
      NOVA_STRIPE_LIVE_ENABLED: "false"
      SECRET_KEY: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Confirm blocked staging CLI never attempts source or database
        run: |
          set -euo pipefail
          unset SAM_GOV_API_KEY OPENAI_API_KEY STRIPE_SECRET_KEY STRIPE_API_KEY ANTHROPIC_API_KEY
          PYTHONPATH=. python scripts/nova_work_autopilot_staging.py > /tmp/nova_work_autopilot_blocked.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/nova_work_autopilot_blocked.json').read_text())
          assert data['status'] == 'BLOCKED'
          assert data['external_submission_allowed'] is False
          assert data['production_release_authorized'] is False
          print('Blocked by default; no database or external discovery attempted.')
          PY
      - name: Test safe bounded discovery and real disposable PostgreSQL locks
        run: |
          set -euo pipefail
          python -m pytest -v -rs tests/test_nova_work_autopilot_cycle.py tests/test_nova_work_autopilot_postgres_ci.py
          echo "Staging-only mocked-provider/autopilot tests. NO real scheduler or production discovery was enabled." >> "$GITHUB_STEP_SUMMARY"
