name: Starter payment binding core

on:
  pull_request:
    paths:
      - "backend/app/core/nova/work_revenue/operations_starter_payment_binding.py"
      - "backend/tests/test_operations_starter_payment_binding_core.py"
      - ".github/workflows/starter-payment-binding-core.yml"
  workflow_dispatch:

jobs:
  binding-guards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test fail-closed paid-task binding
        run: python -m pytest -q tests/test_operations_starter_payment_binding_core.py
