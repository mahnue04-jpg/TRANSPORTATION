name: Nova Voice offline contract
on:
  push:
    paths:
      - 'backend/app/core/nova/creative_studio/local_voice.py'
      - 'backend/tests/test_nova_local_voice.py'
      - 'backend/tests/test_nova_kokoro_local.py'
      - 'backend/tests/test_nova_narration_qa.py'
      - 'backend/tests/test_nova_voice_demo_offline.py'
      - 'backend/tests/test_nova_voice_runner_integration.py'
      - 'backend/app/core/nova/creative_studio/local_voice_demo.py'
      - 'backend/app/core/nova/creative_studio/narration_qa.py'
      - 'backend/app/core/nova/creative_studio/kokoro_local.py'
      - '.github/workflows/nova-voice-offline.yml'
  pull_request:
    paths:
      - 'backend/app/core/nova/creative_studio/local_voice.py'
      - 'backend/tests/test_nova_local_voice.py'
      - '.github/workflows/nova-voice-offline.yml'
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      # Run isolated contract tests outside backend/tests so repository-wide
      # conftest does not load database fixtures or install extra packages.
      - run: |
          mkdir -p /tmp/nova-voice-contract
          cp tests/test_nova_local_voice.py /tmp/nova-voice-contract/test_nova_local_voice.py
          cp app/core/nova/creative_studio/local_voice.py /tmp/nova-voice-contract/local_voice.py
          cp app/core/nova/creative_studio/kokoro_local.py /tmp/nova-voice-contract/kokoro_local.py
          cp tests/test_nova_kokoro_local.py /tmp/nova-voice-contract/test_nova_kokoro_local.py
          cp tests/test_nova_narration_qa.py /tmp/nova-voice-contract/test_nova_narration_qa.py
          cp app/core/nova/creative_studio/narration_qa.py /tmp/nova-voice-contract/narration_qa.py
          cp app/core/nova/creative_studio/local_voice_demo.py /tmp/nova-voice-contract/local_voice_demo.py
          cp tests/test_nova_voice_demo_offline.py /tmp/nova-voice-contract/test_nova_voice_demo_offline.py
          cp tests/test_nova_voice_runner_integration.py /tmp/nova-voice-contract/test_nova_voice_runner_integration.py
          sed -i 's/from \.kokoro_local import /from kokoro_local import /; s/from \.local_voice import /from local_voice import /; s/from \.narration_qa import /from narration_qa import /' /tmp/nova-voice-contract/local_voice_demo.py
          sed -i 's/from \.local_voice import /from local_voice import /' /tmp/nova-voice-contract/kokoro_local.py
          sed -i 's/from app.core.nova.creative_studio.local_voice import (/from local_voice import (/' /tmp/nova-voice-contract/test_nova_local_voice.py
          python -m pytest -q /tmp/nova-voice-contract/test_nova_local_voice.py /tmp/nova-voice-contract/test_nova_kokoro_local.py /tmp/nova-voice-contract/test_nova_narration_qa.py /tmp/nova-voice-contract/test_nova_voice_demo_offline.py /tmp/nova-voice-contract/test_nova_voice_runner_integration.py
        env:
          PYTHONPATH: .
