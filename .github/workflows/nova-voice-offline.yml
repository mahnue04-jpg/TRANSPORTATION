name: Nova Voice offline contract
on:
  push:
    paths:
      - 'backend/app/core/nova/creative_studio/local_voice.py'
      - 'backend/tests/test_nova_local_voice.py'
      - '.github/workflows/nova-voice-offline.yml'
  pull_request:
    paths:
      - 'backend/app/core/nova/creative_studio/local_voice.py'
      - 'backend/tests/test_nova_local_voice.py'
      - '.github/workflows/nova-voice-offline.yml'
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_nova_local_voice.py
        env:
          PYTHONPATH: .
