name: Starter CSV core regression

on:
  pull_request:
    paths:
      - "backend/app/core/nova/work_revenue/operations_csv_cleanup.py"
      - "backend/tests/test_operations_starter_csv_core.py"
      - ".github/workflows/starter-csv-core-regression.yml"
  workflow_dispatch:

jobs:
  starter-csv-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependency
        run: python -m pip install pytest
      - name: Verify CSV cleanup invariants
        run: python -m pytest -q tests/test_operations_starter_csv_core.py
