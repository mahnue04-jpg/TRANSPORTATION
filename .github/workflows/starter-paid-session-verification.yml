name: Starter paid-session verification

on:
  pull_request:
    paths:
      - "backend/app/modules/marketing/models.py"
      - "backend/app/modules/marketing/routes.py"
      - "backend/app/modules/marketing/starter_checkout_verification.py"
      - "backend/tests/test_operations_starter_paid_session.py"
      - ".github/workflows/starter-paid-session-verification.yml"
  workflow_dispatch:

jobs:
  paid-session-guards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check verified Starter payment invariants
        run: python -m pytest -q tests/test_operations_starter_paid_session.py
