name: Nova Creative Studio first-shot and film format gates

on:
  pull_request:
    paths:
      - "backend/app/core/nova/creative_studio/first_shot_readiness.py"
      - "backend/app/core/nova/creative_studio/first_shot_storage.py"
      - "backend/app/core/nova/creative_studio/service.py"
      - "backend/app/core/nova/creative_studio/video_import.py"
      - "backend/static/nova-creative/creative.js"
      - "backend/tests/test_nova_creative_first_shot_storage.py"
      - "backend/app/core/nova/creative_studio/long_form_assembly.py"
      - "backend/app/core/nova/creative_studio/router.py"
      - "backend/app/core/nova/creative_studio/kling.py"
      - "backend/tests/test_nova_first_shot_spending_limit.py"
      - "backend/tests/test_nova_fal_readonly_diagnostic.py"
      - "backend/app/core/nova/creative_studio/fal_diagnostic.py"
      - "backend/tests/test_nova_kling_provider.py"
      - "backend/tests/test_nova_creative_first_shot_readiness.py"
      - "backend/tests/test_nova_creative_single_shot_worker.py"
      - "backend/tests/test_nova_creative_single_shot_db_claim.py"
      - "backend/tests/test_nova_creative_widescreen_assembly.py"
      - ".github/workflows/nova-creative-first-shot-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-shot-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOVA_CREATIVE_VIDEO_LIVE_ENABLED: "false"
      NOVA_CREATIVE_KLING_LIVE_ENABLED: "false"
      NOVA_CREATIVE_IMAGE_LIVE_ENABLED: "false"
      NOVA_CREATIVE_VOICE_LIVE_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check Creative Studio editor JavaScript syntax
        run: node --check backend/static/nova-creative/creative.js
      - name: Install local media validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Verify five-second readiness and portrait/widescreen control plane
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_nova_first_shot_spending_limit.py \
            tests/test_nova_fal_readonly_diagnostic.py \
            tests/test_nova_kling_provider.py \
            tests/test_nova_creative_first_shot_readiness.py \
            tests/test_nova_creative_first_shot_storage.py \
            tests/test_nova_creative_single_shot_worker.py \
            tests/test_nova_creative_single_shot_db_claim.py \
            tests/test_nova_creative_widescreen_assembly.py
