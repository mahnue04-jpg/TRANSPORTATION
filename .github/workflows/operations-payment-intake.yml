name: Operations payment intake
on:
  push:
    branches:
      - "release/operations-live-catalog-20261126"
    paths:
      - 'backend/operations_payment_intake.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_operations_payment_intake.py'
      - 'backend/tests/test_operations_payment_intake_main.py'
      - 'backend/tests/test_operations_production_acceptance.py'
      - 'backend/migrations/sql/20261126_operations_payment_events.sql'
      - 'backend/migrations/sql/20261126_operations_payment_events_writer_grants.sql'
      - '.github/workflows/operations-payment-intake.yml'
  pull_request:
    branches:
      - "release/operations-live-catalog-20261126"
      - "nova/four-plan-consolidated-staging-20261125"
    paths:
      - 'backend/operations_payment_intake.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_operations_payment_intake.py'
      - 'backend/tests/test_operations_payment_intake_main.py'
      - 'backend/migrations/sql/20261126_operations_payment_events.sql'
      - 'backend/migrations/sql/20261126_operations_payment_events_writer_grants.sql'
      - '.github/workflows/operations-payment-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-delivery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Intake lifespan requires writer role on database amicor (production-shaped).
      NOVA_OPERATIONS_DATABASE_URL: postgresql://nova_ops_event_writer:synthetic_writer_only@localhost:5432/amicor
      NOVA_STRIPE_LIVE_ENABLED: "false"
      NOVA_OPERATIONS_CUSTOMER_SALES_ENABLED: "false"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: synthetic_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<0.29' 'stripe>=12,<13' 'psycopg2-binary>=2.9,<3'
      - name: Create amicor database and least-privilege writer
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE amicor;"
          psql -d amicor -v ON_ERROR_STOP=1 -f backend/migrations/sql/20261126_operations_payment_events.sql
          psql -d amicor -v ON_ERROR_STOP=1 -f backend/migrations/sql/20261126_operations_payment_events_writer_grants.sql
          psql -d amicor -v ON_ERROR_STOP=1 -c "ALTER ROLE nova_ops_event_writer WITH LOGIN PASSWORD 'synthetic_writer_only';"
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -p test_operations_payment_intake.py
