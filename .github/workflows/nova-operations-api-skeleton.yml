name: Nova Operations API Fail-Closed Tests

on:
  pull_request:
    paths:
      - 'backend/app/core/nova/work_revenue/operations_csv_api.py'
      - 'backend/tests/test_nova_operations_api_skeleton.py'
      - 'backend/app/core/nova/work_revenue/operations_csv_preflight.py'
      - 'backend/tests/test_nova_operations_csv_preflight.py'
      - '.github/workflows/nova-operations-api-skeleton.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Run fail-closed contract tests
        working-directory: backend
        run: PYTHONPATH=. python -m pytest --noconftest -q tests/test_nova_operations_api_skeleton.py tests/test_nova_operations_csv_preflight.py
