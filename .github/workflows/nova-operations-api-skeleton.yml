name: Nova Operations API Fail-Closed Tests

on:
  pull_request:
    paths:
      - 'backend/app/core/nova/work_revenue/operations_csv_api.py'
      - 'backend/tests/test_nova_operations_api_skeleton.py'
      - 'backend/app/core/nova/work_revenue/operations_csv_preflight.py'
      - 'backend/tests/test_nova_operations_csv_preflight.py'
      - 'backend/app/core/nova/work_revenue/operations_tenant_scope.py'
      - 'backend/tests/test_nova_operations_tenant_scope.py'
      - 'backend/app/core/nova/work_revenue/operations_artifact_manifest.py'
      - 'backend/tests/test_nova_operations_artifact_manifest.py'
      - 'backend/app/core/nova/work_revenue/operations_artifact_registry.py'
      - 'backend/tests/test_nova_operations_artifact_registry.py'
      - 'backend/app/core/nova/work_revenue/operations_local_artifact_store.py'
      - 'backend/tests/test_nova_operations_local_artifact_store.py'
      - 'backend/tests/test_nova_operations_artifact_workflow.py'
      - '.github/workflows/nova-operations-api-skeleton.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<9' 'fastapi>=0.100,<1' 'sqlalchemy>=2,<3'
      - name: Run fail-closed contract tests
        working-directory: backend
        run: PYTHONPATH=. python -m pytest --noconftest -q tests/test_nova_operations_api_skeleton.py tests/test_nova_operations_csv_preflight.py tests/test_nova_operations_tenant_scope.py tests/test_nova_operations_artifact_manifest.py tests/test_nova_operations_artifact_registry.py tests/test_nova_operations_local_artifact_store.py tests/test_nova_operations_artifact_workflow.py
