name: Creative Studio private original static guard

on:
  pull_request:
    paths:
      - "backend/app/core/nova/creative_studio/public_media_guard.py"
      - "backend/app/main.py"
      - "backend/tests/test_nova_imported_static_guard.py"
      - ".github/workflows/studio-original-static-guard.yml"
  workflow_dispatch:

jobs:
  private-original-static-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated guard test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
      - name: Explicitly run imported original public URL denial regression
        run: python -m pytest -q tests/test_nova_imported_static_guard.py
