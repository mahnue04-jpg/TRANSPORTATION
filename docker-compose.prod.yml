# docker-compose.prod.yml — production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file hardens the dev compose for production:
#   - No source volume mounts (immutable image)
#   - Resource limits (CPU + memory)
#   - Restart policy: always
#   - Production log level
#   - Reads secrets from .env (never commit this file with real keys)

version: "3.9"

services:
  api:
    image: amicor:${APP_VERSION:-latest}   # built with: docker build -t amicor:latest .
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --access-log
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      LOG_LEVEL: INFO
      APP_VERSION: "${APP_VERSION:-1.0.0}"
      DB_FILENAME: /data/chat.db
    volumes:
      - amicor_data:/data   # persistent SQLite only — no code mounts
    restart: always
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/detail')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-amicor}
      POSTGRES_USER:     ${POSTGRES_USER:-amicor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in production}
    volumes:
      - amicor_pg:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amicor} -d ${POSTGRES_DB:-amicor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  amicor_data:
    driver: local
  amicor_pg:
    driver: local
  nginx_logs:
    driver: local
