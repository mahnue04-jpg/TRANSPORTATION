# docker-compose.prod.yml — production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file hardens the dev compose for production:
#   - No source volume mounts (immutable image)
#   - Resource limits (CPU + memory)
#   - Restart policy: always
#   - Production log level
#   - Reads secrets from .env (never commit this file with real keys)

version: "3.9"

services:
  api:
    image: amicor:${APP_VERSION:-latest}   # built with: docker build -t amicor:latest .
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --access-log
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LOG_LEVEL: INFO
      APP_VERSION: "${APP_VERSION:-1.0.0}"
      DB_FILENAME: /data/chat.db
    volumes:
      - amicor_data:/data   # persistent SQLite only — no code mounts
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/detail')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  amicor_data:
    driver: local
