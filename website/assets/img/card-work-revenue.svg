<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="wrTitle wrDesc">
  <title id="wrTitle">AMICOR Nova Work and Revenue sample workspace</title>
  <desc id="wrDesc">Illustrative software dashboard with Today, Work and Revenue, a sample queue, and owner-confirmed revenue labels. Not live customer or payment data.</desc>
  <rect width="640" height="280" rx="24" fill="#07141f"/>
  <rect x="16" y="16" width="608" height="248" rx="18" fill="#102233" stroke="#2b97e6" stroke-opacity=".28"/>
  <circle cx="40" cy="40" r="4" fill="#5ee0c4"/><circle cx="54" cy="40" r="4" fill="#2b97e6"/><circle cx="68" cy="40" r="4" fill="#b7c9d8"/>
  <text x="92" y="45" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">AMICOR Nova</text>
  <rect x="430" y="28" width="172" height="24" rx="12" fill="#12344c"/>
  <text x="516" y="44" text-anchor="middle" fill="#b7e0ff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">SAMPLE WORKSPACE</text>
  <rect x="16" y="64" width="132" height="200" fill="#0b1c2a"/>
  <rect x="28" y="80" width="108" height="28" rx="8" fill="#173044"/>
  <text x="82" y="98" text-anchor="middle" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="11">Today</text>
  <rect x="28" y="116" width="108" height="28" rx="8" fill="#0b6bcb"/>
  <text x="82" y="134" text-anchor="middle" fill="#041018" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Work &amp; Revenue</text>
  <text x="82" y="168" text-anchor="middle" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="11">Tasks</text>
  <text x="82" y="196" text-anchor="middle" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="11">Approvals</text>
  <rect x="164" y="80" width="140" height="64" rx="12" fill="#0b1c2a" stroke="#2b97e6" stroke-opacity=".25"/>
  <text x="178" y="102" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="10">OPPORTUNITIES</text>
  <text x="178" y="124" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Queue</text>
  <rect x="316" y="80" width="140" height="64" rx="12" fill="#0b1c2a" stroke="#2b97e6" stroke-opacity=".25"/>
  <text x="330" y="102" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="10">ACTIVE WORK</text>
  <text x="330" y="124" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">In review</text>
  <rect x="468" y="80" width="140" height="64" rx="12" fill="#0b1c2a" stroke="#5ee0c4" stroke-opacity=".3"/>
  <text x="482" y="102" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="10">REVENUE</text>
  <text x="482" y="124" fill="#7ad69a" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Owner-confirmed</text>
  <rect x="164" y="156" width="444" height="92" rx="12" fill="#0b1c2a"/>
  <text x="180" y="180" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="12">Work pipeline</text>
  <text x="430" y="180" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="12">Owner review</text>
  <text x="180" y="206" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="12">AMICOR expected</text>
  <text x="430" y="206" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="12">Approved estimate</text>
  <text x="180" y="232" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="12">AMICOR received</text>
  <text x="430" y="232" fill="#7ad69a" font-family="Segoe UI, sans-serif" font-size="12">Owner-confirmed</text>
</svg>
