  <text x="320" y="292" text-anchor="middle" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">On the Road. On Your Team.</text>
  <rect x="204" y="312" width="72" height="28" rx="8" fill="#0b6bcb"/>
