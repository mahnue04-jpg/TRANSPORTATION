<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="carHubTitle carHubDesc">
  <title id="carHubTitle">AMICOR Car Hub concept</title>
  <desc id="carHubDesc">A dashboard-mounted in-vehicle AMICOR display with a landscape screen on a vehicle dash. Future hardware concept. Not for sale.</desc>
  <defs>
    <linearGradient id="dash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3348"/>
      <stop offset="100%" stop-color="#0b1826"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12344c"/>
      <stop offset="100%" stop-color="#071822"/>
    </linearGradient>
  </defs>
  <rect width="640" height="520" rx="32" fill="#07141f"/>
  <path d="M40 430 C120 250 200 168 320 160 C440 168 520 250 600 430 Z" fill="#102232"/>
  <path d="M70 430 C140 290 220 214 320 208 C420 214 500 290 570 430 Z" fill="#0a1928" opacity=".7"/>
  <path d="M24 430 H616 C600 470 40 470 24 430 Z" fill="url(#dash)"/>
