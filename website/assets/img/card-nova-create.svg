  <rect x="404" y="52" width="212" height="176" rx="16" fill="#0b1c2a" stroke="#5ee0c4" stroke-opacity=".25"/>
  <text x="510" y="88" text-anchor="middle" fill="#5ee0c4" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">HUMAN GATE</text>
  <text x="510" y="120" text-anchor="middle" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Approval required</text>
  <text x="510" y="148" text-anchor="middle" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="12">Draft is not published</text>
  <text x="510" y="170" text-anchor="middle" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="12">from this public site.</text>
