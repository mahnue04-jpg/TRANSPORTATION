<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="createTitle createDesc">
  <title id="createTitle">AMICOR Nova Create sample drafts</title>
  <desc id="createDesc">Illustrative AI-assisted draft cards with an owner-review gate. Not a live public creation marketplace.</desc>
  <rect width="640" height="280" rx="24" fill="#07141f"/>
  <rect x="24" y="28" width="360" height="224" rx="16" fill="#102233" stroke="#2b97e6" stroke-opacity=".28"/>
  <text x="44" y="58" fill="#8fd4ff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">DRAFT</text>
  <text x="44" y="86" fill="#f4f9fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Work materials</text>
  <rect x="44" y="108" width="300" height="10" rx="5" fill="#173044"/>
  <rect x="44" y="128" width="248" height="10" rx="5" fill="#173044"/>
  <rect x="44" y="148" width="276" height="10" rx="5" fill="#173044"/>
  <rect x="44" y="168" width="188" height="10" rx="5" fill="#173044"/>
  <rect x="44" y="200" width="128" height="28" rx="14" fill="#0b6bcb"/>
