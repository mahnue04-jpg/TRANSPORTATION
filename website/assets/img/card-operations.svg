  <text x="52" y="68" fill="#b7c9d8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">HUMAN REVIEW STAYS ON</text>
  <rect x="52" y="92" width="536" height="40" rx="10" fill="#0b1c2a"/>
  <circle cx="78" cy="112" r="12" fill="#2b97e6"/>
