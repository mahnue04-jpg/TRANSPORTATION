# Isolated Nova AI Receptionist STAGING blueprint (#527 / PR #528)
#
# OWNER APPROVAL REQUIRED before applying in the Render Dashboard.
# Do NOT point this at production amicor-health-isf-db.
# Do NOT reuse or modify existing nova-growth-validation-490 / nova_ga_490_dispos.
# Do NOT enable live calendar writes, live email, or live Twilio voice.
#
# Resource note: an isolated paid 0.1c-256mb PostgreSQL database is owner-approved
# up to $6/month in Saye's workspace. A separate staging database already
# exists as nova-receptionist-staging-db-h799 (nova_ga_receptionist_dispos).
# DO NOT reapply this Blueprint to create a duplicate resource or incur an
# additional charge; reconcile/adopt existing resources only after a new review.
#
# Migration note: free web services do NOT support preDeployCommand.
# releaseCommand is not a valid Blueprint field. Migrations run inside
# startCommand via scripts/receptionist_staging_start.py (advisory-locked).
#
# autoDeployTrigger is off — owner deploys the exact approved commit SHA only.
#
# Existing Render service (2026-11-16): nova-receptionist-staging-h799
#   https://nova-receptionist-staging-h799.onrender.com/nova/growth
# This reference Blueprint still uses template resource names. Do not apply it
# over or alongside the live-h799 resources without an adoption plan.

databases:
  - name: nova-receptionist-staging-db
    plan: 0.1c-256mb
    databaseName: nova_ga_receptionist_dispos
    user: nova_ga_receptionist

services:
  - type: web
    name: nova-receptionist-staging
    runtime: python
    plan: free
    rootDir: backend
    branch: cursor/nova-receptionist-staging-release-c9ac
    autoDeployTrigger: "off"
    buildCommand: pip install --upgrade -r requirements.txt
    # Free-plan supported path: guarded Alembic upgrade then uvicorn.
    # Fails closed on migration / DB / commit-guard errors (no SQLite fallback).
    startCommand: python scripts/receptionist_staging_start.py
    healthCheckPath: /api/health/readiness
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nova-receptionist-staging-db
          property: connectionString
      - key: ALEMBIC_DATABASE_URL
        fromDatabase:
          name: nova-receptionist-staging-db
          property: connectionString
      - key: APP_ENV
        value: staging
      - key: AMICOR_ENVIRONMENT
        value: staging
      - key: APP_VERSION
        value: 2026.11.16-nova-receptionist.staging
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AMICOR_SEED_PASSWORD
        sync: false
      - key: AMICOR_DEPLOYMENT_SYNC_KEY
        sync: false
      - key: AMICOR_PUBLIC_URL
        value: https://nova-receptionist-staging-h799.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://nova-receptionist-staging-h799.onrender.com
      - key: NOVA_GA_EXPECTED_DATABASE_NAME
        value: nova_ga_receptionist_dispos
      - key: NOVA_GA_EXPECTED_ALEMBIC_REVISION
        value: 20261116_nova_ga_receptionist
      # Optional exact host pin after Render assigns the private DB hostname.
      - key: NOVA_GA_EXPECTED_DATABASE_HOST
        sync: false
      # REQUIRED: full 40-character hex tip SHA. Missing/abbrev/mismatch fails startup.
      - key: NOVA_GA_EXPECTED_GIT_COMMIT
        sync: false
      - key: NOVA_GROWTH_AGENT_ENABLED
        value: "true"
      - key: NOVA_GROWTH_AGENT_DEMO_MODE
        value: "true"
      - key: NOVA_GROWTH_AGENT_WIDGET_ENABLED
        value: "true"
      - key: NOVA_GROWTH_AGENT_WIDGET_SECRET
        sync: false
      - key: NOVA_GROWTH_AGENT_BACKGROUND_WORKER
        value: "true"
      - key: NOVA_GROWTH_AGENT_RETENTION_SCHEDULE_ENABLED
        value: "true"
      - key: NOVA_GROWTH_AGENT_RETENTION_DELETE_ENABLED
        value: "false"
      - key: NOVA_GROWTH_AGENT_CALENDAR_SYNC_WORKER
        value: "true"
      - key: NOVA_GROWTH_AGENT_OWNER_NOTIFY_WORKER
        value: "true"
      - key: NOVA_GROWTH_AGENT_VOICE_SIMULATOR
        value: "true"
      # OAuth token HTTP only — does NOT enable REAL_CALENDAR_WRITE / email / voice.
      - key: NOVA_GA_GOOGLE_OAUTH_HTTP_ENABLED
        value: "false"
      - key: NOVA_GA_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: NOVA_GA_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: NOVA_GA_GOOGLE_OAUTH_REDIRECT_URI
        value: https://nova-receptionist-staging-h799.onrender.com/api/nova/growth-agent/calendar/oauth/callback
      - key: NOVA_GA_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: NOVA_STRIPE_LIVE_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
