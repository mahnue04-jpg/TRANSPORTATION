# nginx/nginx.conf — reverse proxy for Amicor production deployment
# Sits in front of the FastAPI backend (upstream: api:8000)
# Features: TLS termination, gzip, rate limiting, security headers, SSE support

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"ref":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"req_id":"$http_x_request_id",'
        '"latency":"$request_time"}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream amicor_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Redirect all HTTP to HTTPS in production (comment out for plain HTTP)
        # return 301 https://$host$request_uri;

        # ── Security headers (complements app-level headers) ─────────────────
        add_header X-Content-Type-Options   "nosniff"                   always;
        add_header X-Frame-Options          "DENY"                      always;
        add_header X-XSS-Protection         "1; mode=block"             always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=()"  always;

        # ── Upload limit ─────────────────────────────────────────────────────
        client_max_body_size 11M;

        # ── Static files ─────────────────────────────────────────────────────
        location /static/ {
            proxy_pass         http://amicor_api;
            proxy_set_header   Host $host;
            expires            7d;
            add_header         Cache-Control "public, immutable";
        }

        # ── Auth endpoints (strict rate limit) ───────────────────────────────
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://amicor_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Upload endpoint (upload rate limit) ──────────────────────────────
        location /api/upload {
            limit_req zone=upload_zone burst=3 nodelay;
            proxy_pass         http://amicor_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
        }

        # ── SSE streaming endpoint (no proxy buffering) ───────────────────────
        location /api/chat/stream {
            limit_req zone=api_zone burst=10;
            proxy_pass         http://amicor_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_http_version 1.1;
            # Critical for SSE: disable buffering
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 120s;
            add_header         X-Accel-Buffering "no";
        }

        # ── General API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass         http://amicor_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── App shell ─────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://amicor_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # ── HTTPS server (uncomment and configure for TLS) ────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #     ssl_certificate     /etc/ssl/certs/amicor.crt;
    #     ssl_certificate_key /etc/ssl/private/amicor.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     # ... same location blocks as above
    # }
}
