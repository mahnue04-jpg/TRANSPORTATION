<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider — Nova Stable</title>
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/js/stable-ui.js"></script>
  <script src="/js/core.js"></script>
</head>
<body class="stable-boot">
  <header class="app-header">
    <h1>Provider Portal</h1>
    <div id="userBar" class="hidden"><span id="userLabel"></span> <button class="secondary" id="logoutBtn">Logout</button></div>
  </header>
  <main>
    <section class="card">
      <h3>Facility</h3>
      <label><select id="facilitySelect"></select></label>
      <button id="refreshBtn" class="secondary">Refresh</button>
    </section>
    <section class="card">
      <h3>Bulk Schedule</h3>
      <div id="bulkRows"></div>
      <button id="addRowBtn" class="secondary">Add Row</button>
      <button id="submitBulkBtn">Submit Bulk</button>
    </section>
    <section class="card"><h3>Trips</h3><div id="tripsTable"></div></section>
  </main>
  <div id="toast"></div>
  <script>
    if (!Amicor.requireAuth(['provider', 'dispatcher', 'admin'])) throw new Error('auth');
    Amicor.renderUserBar();

    function addRow(values) {
      var wrap = document.createElement('div');
      wrap.className = 'card';
      wrap.innerHTML =
        '<label>Patient<input class="pname" value="' + (values && values.patient_name || '') + '" /></label>' +
        '<label>Phone<input class="pphone" value="' + (values && values.phone || '') + '" /></label>' +
        '<label>Pickup<input class="ppickup" value="' + (values && values.pickup || '') + '" /></label>' +
        '<label>Dropoff<input class="pdropoff" value="' + (values && values.dropoff || '') + '" /></label>' +
        '<label>Type<select class="ptype"><option>medical</option><option>dialysis</option></select></label>';
      document.getElementById('bulkRows').appendChild(wrap);
    }

    function refreshDashboard() {
      return Amicor.api('/provider/dashboard?facility_id=' + encodeURIComponent(document.getElementById('facilitySelect').value))
        .then(function (data) {
          var html = '<table><thead><tr><th>Status</th><th>Patient</th><th>Route</th><th>Fare</th></tr></thead><tbody>' +
            data.trips.map(function (t) {
              return '<tr><td><span class="pill">' + t.status + '</span></td><td>' + (t.patient_name || '—') + '</td><td>' + t.pickup + '</td><td>$' + Number(t.estimated_fare || 0).toFixed(2) + '</td></tr>';
            }).join('') + '</tbody></table>';
          AmicorStable.setHtmlIfChanged(document.getElementById('tripsTable'), html);
        });
    }

    function loadFacilities() {
      return Amicor.api('/facilities').then(function (facilities) {
        document.getElementById('facilitySelect').innerHTML = facilities.map(function (f) {
          return '<option value="' + f.id + '">' + f.name + '</option>';
        }).join('');
        return refreshDashboard();
      });
    }

    document.getElementById('addRowBtn').onclick = function () { addRow({}); };
    document.getElementById('refreshBtn').onclick = function () { refreshDashboard().catch(function (e) { Amicor.toast(e.message); }); };
    document.getElementById('submitBulkBtn').onclick = function () {
      var trips = Array.from(document.querySelectorAll('#bulkRows .card')).map(function (row) {
        return {
          patient_name: row.querySelector('.pname').value,
          phone: row.querySelector('.pphone').value,
          pickup: row.querySelector('.ppickup').value,
          dropoff: row.querySelector('.pdropoff').value,
          type: row.querySelector('.ptype').value,
        };
      }).filter(function (t) { return t.pickup && t.dropoff; });
      Amicor.api('/provider/bulk-schedule', { method: 'POST', body: JSON.stringify({ trips: trips }) })
        .then(function (r) { Amicor.toast('Created ' + r.trips.length); document.getElementById('bulkRows').innerHTML = ''; refreshDashboard(); })
        .catch(function (e) { Amicor.toast(e.message); });
    };

    addRow({ patient_name: 'Dialysis Patient A', pickup: '100 Main St', dropoff: 'Dialysis Center' });
    loadFacilities().catch(function (e) { Amicor.toast(e.message); });
    AmicorStable.startPolling(function () { refreshDashboard().catch(function () {}); }, AmicorStable.POLL_MS);
  </script>
</body>
</html>
