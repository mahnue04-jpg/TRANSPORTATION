# Deploy Amicor Nova Stable to Render (SQLite — no Postgres addon required)
services:
  - type: web
    name: amicor-nova-stable
    runtime: node
    rootDir: nova-stable
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SQLITE_PATH
        value: /var/data/amicor_nova.db
